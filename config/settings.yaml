# ── DIRECTION-OVERRIDE SEAM (src/analysis/direction_override.py) ──────────────
# Lets an external decider PICK the trade side, quant as fallback. DEFAULT = quant
# (this block is inert until mode!=quant). A side only changes when mode!=quant AND
# enforce=true; enforce=false = SHADOW (logs DIRECTION_OVERRIDE, never changes a side).
# Toggle live with scripts/claude_direction.py. Fail-safe: any problem => quant side.
direction:
  # ══════════════════════════════════════════════════════════════════════════════
  # 2026-08-14 DIRECTION SIDE-OVERRIDE BENCHED (operator GO). THIS IS THE SWITCH,
  # NOT A NEW DECISION — it makes the config agree with what the code already does.
  #
  # SCOPE — read this before touching it. This benches the direction SIDE-OVERRIDE
  # engine ONLY (the ai_direction_engine/psb_direction_driver daemons that write
  # override_file). It does NOT touch the `ai:` block at line ~2597, which stays
  # enabled: true / live_inferencing: true. Turning THAT off was wrong once already
  # (feedback_btc_ai_off_revert_guardrail_2026_06_29) and is not what this is.
  #
  # WHY — the override lost to a coin flip, twice, on real resolutions:
  #   * a72b16e2 + 4eb70038, scripts/resolver_vs_quote.py, 171,380 settled ghosts in
  #     the 0.45-0.55 band, every policy on the SAME rows, EV/$1 @1c:
  #         favorite 50.63% -0.0215 | always_up 50.59% -0.0133 | coinflip 50.09% +0.0020
  #         resolver 48.24% -0.0525 | ai_hist  47.79% -0.0584  <- AI is LAST of five
  #   * scripts/ai_direction_exact_join.py, 31,142 calls / 7,147 markets: providers
  #     carry NO information beyond the quote. Roadmap logs this REFUTED/CLOSED.
  #
  # AND ITS SIDE IS DISCARDED ANYWAY. With side_policy: favorite below, sol_macro.py
  # :3729 (and the eth/bitcoin twins) overwrite the override's side with the market
  # favorite two statements after reading it. The override's only surviving effect is
  # ADMISSION: it turns a NEUTRAL sit-out into a trade at the favorite's side, i.e.
  # more volume on a pool whose own measured EV is negative. That is not a frequency
  # fix, and reopening the neutral pool has its own sanctioned path — roadmap S3, bar
  # n>=300 settled true-neutral rows/lane/side, positive after 2c, 5m excluded. As of
  # 2026-08-14 S3 is NOT graduated (max 107 markets, 5m only, ~coinflip).
  #
  # NO BEHAVIOUR CHANGE TODAY. The daemons died 2026-08-13 19:34 (all providers ERR)
  # and override_file has been an empty 2-byte '{}' since, so resolve() already
  # returned quant_side on every call. mode: quant takes the same branch immediately
  # (direction_override.py:166). This edit prevents a future daemon restart from
  # silently RE-ARMING a measured-negative policy — the kill was only in git history,
  # where it was invisible to the running system. `direction` is in
  # _HOT_RELOAD_TOP_LEVEL_KEYS (main.py:96), so this applies without a restart.
  #
  # TO REVERT: mode: claude + enforce: true, and restart the two daemons. Do that only
  # with a CURRENT-ERA live-realized measure that beats the quote — not on a hunch, and
  # not because trade frequency looks low. Frequency is not evidence of edge.
  # ══════════════════════════════════════════════════════════════════════════════
  mode: quant     # was: claude (2026-08-12 operator restore, PRE-DATES the 08-13 refutation above)
  enforce: false  # was: true
  override_file: data/runtime/claude_direction_override.json
  max_age_sec: 900       # override staleness belt (each entry may also carry its own ttl)
  override_when_quant_neutral: true    # inert while mode: quant — kept so a revert is one-line
  apply_windows: ['1h', '15m']    # inert while mode: quant. Operator directive: 15m was ALWAYS meant to be AI-driven.
  min_conf: 0.0          # ignore overrides below this confidence
  # ── SIDE POLICY (2026-08-13, operator GO after Codex design review) ────────────
  # WHO PICKS THE SIDE. `resolver` = legacy (the native bias stack + its flip/fade
  # modifiers). `favorite` = take whichever side the MARKET already prices above 0.50.
  #
  # WHY: scripts/resolver_vs_quote.py scored every policy on the SAME 171,380 settled
  # ghost candidates (real Polymarket resolutions, Aug 10-13), restricted to the
  # 0.45-0.55 toss-up band where the quote carries no direction, as EV per $1 staked
  # at the price actually payable, 1c cost:
  #     always_up  50.59%  -0.0133   |  favorite  50.63%  -0.0215
  #     resolver   48.24%  -0.0525   |  ai_hist   47.79%  -0.0584
  # The resolver is beaten by a coinflip (50.09%, +0.0020) at 95% CI +/-0.24pt, and the
  # AI override (correctly time-joined from the shadow log) is worse still. Per lane the
  # resolver beats the favorite in 6/20 and ONLY bnb_macro|1h has positive EV@1c with it
  # (54.6% vs favorite 40.4%, +0.0750, n=1224) -> that lane is exempted below.
  #
  # always_up measured BEST but was rejected deliberately: it is a static long bet that
  # only wins in an up-tape. `favorite` follows whatever the market prices, so it
  # self-flips with the tape and cannot be caught facing the wrong way.
  #
  # HONEST SCOPE (Codex): this is LOSS REDUCTION, not alpha. Favorite's aggregate EV is
  # still NEGATIVE. The sample is REJECTED candidates, so favorite's advantage is not
  # proven on the admitted population. Paper-only experiment with the kill rule below.
  side_policy: resolver
  # 2026-08-13 EXEMPTION REMOVED (operator challenge: "are we sure bnb 1h is really
  # benefiting?"). It was not. bnb_macro|1h was exempted off the GHOST band measure
  # (54.6% direction accuracy, EV +0.0750, n=1224) — LIVE REALIZED says the opposite and
  # live is the decision standard: n=171, WR 43.3%, net -$181.32; the bare bnb_1h_native
  # path in-band is n=17 WR 17.6% -$64.68. Per $/trade it is the 4th-WORST lane in the
  # bot (-$1.76/t). I exempted the one lane I should have cut hardest.
  #
  # The wider check that settled it: split LIVE resolver P&L per lane BY ERA, in-band.
  # ZERO of 21 lanes are positive in every era with n>=15 — every lane that looked good
  # pooled (xrp5m +$246, hype5m +$256, btc5m +$71) was carried by June and has gone
  # negative since; EVERY August cell is negative. Pooled lane-P&L was poisoned by a dead
  # era, the exact trap feedback_time_filter_reject_logs_before_concluding warns about.
  # CAVEAT kept honest: August is also when the sizing/geometry blowup and the flat_sizing
  # scope bug were live, so "everything negative in August" is partly bot-wide, not proof
  # about direction alone. It is the INDEPENDENT agreement that decides it — the ghost
  # band measure carries no exits and no sizing at all, and it says 48.24% vs a coinflip.
  # Empty list => the resolver picks the side on NO lane. Re-add a lane here the moment it
  # earns it on CURRENT-ERA live realized.
  side_policy_resolver_lanes: []
  # 2026-08-13 DEADBAND -> 0.0 (operator: "widen the band"). The binding constraint was
  # NOT the outer band, it was this. Price histogram of settled ghosts: 0.51 alone is 48.9%
  # of ALL candidates, and 0.49-0.51 together are ~68% -- so a +/-0.01 deadband was blocking
  # two thirds of the pool, which is why the policy took ZERO entries in its first cycles.
  # And the assumption behind it (Codex: "at 0.50 the favorite is quote jitter") is REFUTED
  # by measurement -- per-cent accuracy vs real resolutions, EV/$1 @1c:
  #     0.48  n=  5990  DOWN  47.8% +/-1.26   -0.0920
  #     0.49  n= 18299  DOWN  50.7% +/-0.72   -0.0178
  #     0.50  n= 22181  UP    50.4% +/-0.66   -0.0120
  #     0.51  n=104404  UP    50.9% +/-0.30   -0.0121   <- best EV, half the pool
  #     0.52  n=  7786  UP    49.4% +/-1.11   -0.0609
  # The sliver is the LEAST-bad part of the distribution; the prices just OUTSIDE it (0.48,
  # 0.52) are the worst. The deadband was excluding the good part and keeping the bad.
  # HONEST: 0.51 pays 0.96:1 so it needs 51.0% to break even gross and delivers 50.9% -- it
  # is a coin flip priced fairly. It barely loses; it does not win. Still loss-reduction.
  side_policy_deadband: 0.0
  # Outer band KEPT at 0.45-0.55. Widening it monotonically improves EV/$1 (0.30-0.70 gives
  # -0.0463, full range -0.0307) but ONLY because wider bands buy heavier favorites, whose
  # accuracy is high purely because they are expensive -- that is the >=0.85 payoff trap
  # (b=0.13, needs 88% WR, -$448 all-time) the operator already killed once. Not walking
  # back into it for 2 cents of EV. Frequency comes from the deadband fix above instead.
  side_policy_price_band: [0.45, 0.55]
  side_policy_flat_edge: 0.02    # a favorite-side trade has ~0 model edge BY CONSTRUCTION (est_prob
                                 # came from the resolver machinery we just removed). Size on a flat
                                 # edge like risk.rsi_fade.flat_edge instead of pretending the model
                                 # estimated it; without this every favorite trade dies on its own
                                 # min_edge/conviction floors. Codex q2 option (c).
  # KILL RULE (hot-reload, no restart): set side_policy: resolver if after 50 closed
  # favorite-policy trades (or 24h) net is worse than -0.03/$1 staked, OR any lane hits
  # n>=20 worse than -0.05/$1, OR entry count collapses >70% on price-band/centered skips.
# ── FAVORITE-LONGSHOT lane (08-07) ──────────────────────────────────────────
# Structural price bet: buy the FAVORITE (our-side price >= floor) side-agnostic.
# Bypasses est_prob/edge/price-band machinery entirely — favorites are structurally
# underpriced (favorite-longshot bias) so this is +EV with NO direction prediction.
# Runs as a SEPARATE pass appended after the normal scan (deduped vs normal signals).
# PAPER only. Skips 5m (thin books / settlement manipulation near expiry).
  # 08-08 RE-ENABLED (operator caught the confound): the earlier "cut, it's a loser" read
  # was measured while the exit-BLINDNESS bug was live — it inflated losses to -$70 (vs -$35
  # capped) AND prevented the de-risk from firing, corrupting both loss sizes and WR. That was
  # NOT a fair trial. Now that _mark_delta_blind_skip() lets the cap/de-risk actually run, RE-TEST
  # favorites with working exits and judge on CLEAN data. Freshness was ruled out (losers had
  # fresher prices). If it still loses with working caps -> then cut for real.
lane_tape_adapter:
  # 2026-08-14 RESTART REPRODUCIBILITY. hydrate_max_age_hours is now ONLY the absolute
  # staleness ceiling — depth is per-lane (last `window_closes` per lane, main.py
  # _hydrate_adaptive_state). It used to be BOTH, at 12h, which made warm-start a function
  # of when you restarted: 08-13 19:55 PT booted 37 closes/9 lanes, 08-14 12:10 PT booted
  # 15/4 off identical config. A lane under min_samples is tape-BLIND (delta 0.0, mult 1.0),
  # so which lanes were merely BUSY before a restart decided which lanes got managed.
  # Widened to 7d because it no longer controls depth. Lower it if stale closes prove to
  # loosen admission wrongly (admission_delta can go negative; size_mult never enlarges).
  # Codex measured the trade-off: 48h -> 15 lanes/11 warm, 72h -> 28/20, 120h -> 36/33,
  # 168h -> 38/33. So 48-72h do NOT preserve the warm set (clock-dependence returns for
  # slow lanes); 120h buys the same warm set as 168h with 2 fewer days of staleness.
  # RESIDUAL HAZARD, deliberately NOT patched here: admission_delta is SIGNED, so a stale
  # WINNING close can still LOOSEN a lane. Codex's fix is a per-lane "no negative admission
  # until N fresh live closes" freshness clamp — a real mechanism with its own state, so it
  # gets its own change, not a rider on this one. Size is already safe (max_mult <= 1.0).
  hydrate_max_age_hours: 120.0
  mode: "shadow"              # 2026-08-16 SAFETY HOLD. Keep observing lane tape, but do not de-size live trades until the realized-P&L signal is re-derived against clean resolution evidence; recent hard cuts on bnb|5m|up and hype|5m|up were not backed by trades_settled.jsonl.
  admission_mode: "off"       # 2026-08-16 SAFETY HOLD. Prevent realized-P&L tape from raising/lowering min_edge while the exit-layer stop confound is under review.
  window_closes: 6            # rolling realized closes per lane (fast reaction)
  min_samples: 3              # need >=3 closes before adapting; else neutral 0.0
  green_arm_pct: 0.08         # a close counts green if MFE reached +8%
  green_keep_rate: 0.5        # a net-losing lane still hitting green >=50% is variance, not tape-turn -> not de-admitted
  loss_ref_dollars: 4.0       # avg realized loss at which tighten maxes
  recency_ramp: 2.0           # newest close weighted 2x oldest
  admission_tighten_max: 0.05 # max +delta on a losing never-green side
  admission_loosen_max: 0.02  # max -delta on a winning side (gentle)

favorite_lane:
  enabled: true   # 2026-08-12 STAGED (dormant on disk, NO restart performed — takes effect on the operator's next restart). DUPLICATE-SWITCH CLASH found by Codex: this key and risk.favorite_lane_enabled BOTH gate the favorite lane and DISAGREED — this said true while risk.favorite_lane_enabled said false. Code reads both (sol_macro.py:7602 reads favorite_lane.*, :7606 reads risk.favorite_lane_enabled), and the risk. one currently wins, so trading behavior is UNCHANGED today (verified: no 0.85+ fills in recent sessions). The danger was latent: a stale `true` contradicting the operator's 08-10 kill is exactly how the favorite payoff-trap (win-11%/lose-90%, b=0.13, needs 88% WR, -$448 all-time) gets silently reintroduced on a future baseline revert. Both switches now agree = false.  # 2026-08-13 RE-ENABLED FOR ONE RESTART (operator: "just for this restart to see how it goes"). Scoped by favorite_lane.allow_lanes to xrp|1h + hype|15m ONLY — the rest of the book, and the whole 15m book, stays dead. Both switches must agree: risk.favorite_lane_enabled is the one that actually wins at sol_macro.py:7724.
  floor: 0.85            # admit only if fav_price (max(yes,1-yes)) >= this
  window_floors:         # 2026-08-10 PER-WINDOW FLOOR (operator "improve if data offers a filter, else cut"). 1h favorites split (n=29, 8 sess): 0.85-0.89 = 50% WR net -$65 (a 1h fav has a full HOUR to cross back through strike => 0.86 is a coin-flip); 0.90-0.94 = 72.7% WR net +$3.88 (clears 68% breakeven). 15m favs win 87% at 0.85 (net +$175 — UNTOUCHED). Raise ONLY 1h's floor. Turns 1h favs -$61 -> ~breakeven+. Absent/per-tf-absent => uses `floor` (byte-identical). Hot-reloads (read in _favorite_lane_signals via full_config.get each scan).
    "1h": 0.90
  price_max: 0.93        # 08-07 HUGE-LOSS FIX: skip DEEP favorites (>=0.93). A 0.96 fav pays ~4% per win but loses ~96% of stake when it gaps to $0 at settlement (the xrp -$70.37 was entry 0.96) — worst risk/reward. The 0.85-0.93 band pays enough per win (~9-18%) to survive its own loss ratio.
  size_usd: 25.0         # 2026-08-10 ROLLED BACK 70->25 (operator, longevity/Kelly): favorites are Kelly-NEGATIVE (p0.77 b0.29 => f*=-0.02) so $70=7% of bankroll on a -EV lane = ruin risk. +869 baseline had NO fav lane + $25 max. $25 base; per-lane winners upsized via adaptive_sizer (proven_lane_max_usd 40).
  size_taper_enabled: true   # 2026-08-09 #2 SIZE-TAPER (operator GO): scale stake by payoff (1-fav_price)/(1-floor); 0.85 fav=full, 0.93 fav=~0.47x. Scope: 0.88-0.91 band 71%WR but -$111 (thin payoff); recovers ~+$50, zero trades cut. RESTART-CLASS (code).
  size_taper_min_frac: 0.4   # floor on the taper (never below 40% of size_usd)
  size_taper_start: 0.88     # full size up to 0.88 (the +$72 sweet spot); taper only 0.88->0.93 (the bleed bands)
  sit_out_trend_aligned_mode: shadow   # 2026-08-09 #1 (operator GO, SHADOW-first): favorites bet WITH a trending tape BLEED (-$365); FLAT/against-trend WIN. shadow=log would-sit-out only (still trades); live=sit out aligned; off=byte-identical. Flip to live after shadow confirms.
  allow_lanes: ["xrp_macro|1h", "hype_macro|15m"]   # 2026-08-13 PER-LANE ALLOWLIST. Measured on 446 live favorite trades (net -$444.65): 15m book = the ENTIRE loss (n=324, -$464.50, -$1.43/t); 1h book net positive (n=122, +$19.85). Keepers: xrp|1h 95.2% WR +$117.49 (+$5.59/t, n=21) and hype|15m 100% WR +$50.94 (+$6.37/t, n=8). The bleeders run 77-79% WR — win rate is NOT the discriminator, payoff b=0.13 is. Empty list => no allowlist.
  windows: [15m, 1h]     # 08-08 15m RESTORED: the earlier "cut 15m, it bled -$185" was the SAME confound — those -$70 15m losses were the exit-BLINDNESS bug (settlement gap-through skipped the cap), not a 15m-lane defect. With _mark_delta_blind_skip() live those cap at ~-$35. Re-test both windows on clean data before cutting anything.
  min_mins_left: 3.0     # avoid last-candle settlement manipulation
  presettle_derisk_secs: 180     # 08-07 HUGE-LOSS FIX (the gap-through): a %-stop CANNOT catch a favorite gapping 0.85->$0 in the final settlement candle (the sol -$70.81 entry 0.87 rode to RESOLVED:NO). In the final N secs, if a favorite's mark has FLIPPED to <= presettle_derisk_price (i.e. it's now the underdog = losing), exit to salvage instead of $0. Winners mark toward 1.0 near settlement so they're never touched. 0 => disabled. 08-08 NUDGE 120->180: give slower 1h favorites more runway to be caught.
  presettle_derisk_price: 0.55   # 08-08 NUDGE 0.5->0.55: the bnb 1h loser expired at mark ~0.53 (entry 0.88, -40%), JUST above the 0.5 threshold, so the de-risk missed it (updown_expired -$32.39). 0.55 catches a favorite that has slipped to a coinflip-ish underdog. Still well below a winning favorite (>0.6), so it won't cut winners.
  hard_stop_price: 0.70    # 2026-08-08 06:1x DISABLED (was 0.70) — AUTOWAKE REVERT, it cut WINNERS 3-for-3 in its first 4 minutes live. Session test_20260808_060714, the 9:00-9:15AM ET window: sol entry 0.86 cut 0.695 -$15.41 | btc entry 0.90 cut 0.415 -$39.75 (the paged bust) | xrp entry 0.86 cut 0.675 -$17.09 = -$72.25 realized. CLOB prices-history says ALL THREE Up tokens settled 0.995 (WON): sol 0.875->0.685 dip->0.995, btc 0.705->0.755->0.995, xrp whipsaw->0.995. doge (control, same window, never dipped below 0.90) was never cut and won. A 15m favorite bought at 0.85-0.93 routinely dips to 0.60-0.70 mid-window and still settles 1.0 — a 0.70 mark stop is structurally guaranteed to cut the lane's winners, which IS the lane's 94%-WR edge (hold to resolution). The btc one is worse still: it fired on mark 0.415 (best_bid 0.41/ask 0.42, ws age 6.9ms) at 13:09:44 when the real tape was ~0.62-0.755 — a mark that never existed, after 106s where the position was invisible to check_exits (mfe=0.0, mae==exit pnl => not one intervening tick was evaluated). 0 => off; loss control reverts to hold_catastrophic_stop_pct -55% + the presettle de-risk above (the config the proven favorite lane ran in). Do NOT re-enable without evidence from settled favorites that a mid-window dip below 0.70 actually predicts a LOSS.
  early_stop_windows: []  # 2026-08-16 SOL 1h BAD-STOP HOLD. Was [1h], which let an ever-green native SOL 1h BUY_NO (MFE +45.7%) get cut by hold_catastrophic_stop at -55.4% with 6.5m left. With current hold_mfe_conditional_stop_enabled:false, [] means 1h hold lanes now ride to resolution instead of taking early catastrophic cuts. REVERT to [1h] only if settled hold-counterfactual proves 1h dips are worse held than stopped.
  tape_sit_out_delta: 0.02  # 2026-08-08 REALIZED TAPE DEFERENCE: sit out a favorite side while get_tape_admission_delta(asset,window,side) >= this (side net-losing/never-green in CURRENT tape). Self-flips with the tape; both sides losing (chop) => both sit out. Needs lane_tape_adapter.admission_mode: live. 0 => off.
  respect_ai_direction: true  # 2026-08-08 favorite lane HONORS the AI direction driver (was side-agnostic, ignored it): AI FLAT/sit-out => skip asset; AI LONG => only UP favorites; AI SHORT => only DOWN. Kills the sol whipsaw (AI said sol=FLAT, favorite bought both sides+lost). false => legacy side-agnostic.
  fav_net_sit_out_avg: -1.0   # 2026-08-10 FAVORITE-SCOPED REALIZED-NET SIT-OUT (operator GO). Sit out a favorite (asset,window,side) while its rolling AVG realized net per favorite close <= this ($/trade). Reads favorite_net_tracker (FAVORITE-only closes, entry>=floor, keyed asset|window|side) — NOT lane_tape_adapter (which mixes favorite+band + is MFE/green not NET, so it read sol|15m|up as loosen while it bled -$99). Payoff-trap aware (favorites are high-WR/neg-NET). Validated on journal: -1.0 sits out doge15mDOWN(-6.3) xrp15mUP(-4.4) bnb1hUP(-3.5) sol1hDOWN(-2.2) etc; KEEPS xrp1h(+6.6) sol15mUP(+3.5). Self-flips: rolling window rolls losers off / recovery re-admits. null/absent => OFF (fail-open). RESTART-CLASS (favorite_lane not hot-reloadable).
  fav_net_window: 12          # rolling window: last N favorite closes per lane
