  ws_endpoint: wss://ws-subscriptions-clob.polymarket.com/ws
  network: polygon
  chain_id: 137
  min_liquidity: 10000
  max_spread: 0.05
  scanner_sync_timeout_sec: 35
  fetch_hype_alt_markets: true
  gamma_http_max_retries: 3
  gamma_http_retry_backoff_base_sec: 0.5
  creds_max_age_hours: 144
  auto_rederive_credentials: true
  rederive_credentials_on_start: true
  signature_type: 1
  funder_address: '0x932845f226ffb93ec14d37add977446cf0d8a6eb'
hyperliquid:
  # 2026-06-16: fail-fast to stale cache. Was 25s read x 4 retries = ~100s worst case
  # for ONE timeframe; get_full_analysis fetches ~7, which (run inline on the loop)
  # produced the 43s hype scan that wedged the cycle to 92s and starved exits/dashboard.
  # Now a slow timeframe costs seconds and falls to stale cache (<=180s old), all under
  # the 15s per-lane scan guard (strategies.*.scan_analysis_timeout_sec).
  request_timeout_sec: 8
  range_request_timeout_sec: 12
  connect_timeout_sec: 3
  max_retries: 2
  retry_backoff_base_sec: 0.5
  stale_on_error_max_age_sec: 180
trading:
  cycle_interval_sec: 60
  exit_check_interval_sec: 3  # 10->3: cut stop-detection latency on fast 5m binaries (late-stop overshoot -15% intended vs -39% realized). Pure cadence; no gate/width change.
  execution_provider: olympus
  entry_mode: marketable
  entry_maker_wait_sec: 8
  entry_hybrid_windows:
  - 15m
  - 1h
  microstructure_enrichment_enabled: false
  microstructure_trade_flow_window_sec: 300
  crypto_hourly_scan_every_n_cycles: 1   # 2026-06-15: un-throttle — 1h windows closing before scanner looks (architecture, not edge)
  overrun_recovery_sleep_sec: 5
  dry_run: true
  slippage_guard:
    enabled: true
    mode: enforce
    max_slippage_cents: 0.02
    max_spread_cents: 0.03
    require_full_depth: true
    depth_price_ceiling_cents: 0.0
  clob_ws:
    enabled: true
    book_channel: market
    subscribe_interval_sec: 15
    asset_ids_json_key: assets_ids
  default_position_size: 6
  max_position_size: 25   # 2026-06-16 revert-to-0613: undo 1.6x paper ladder (was 40)
  max_days_to_resolution: 365
  min_hours_to_resolution: 1
  max_exposure_per_trade: 0.08
  max_topic_exposure: 0.2
  daily_loss_limit: 0.15
  kelly_fraction: 0.37
  regime:
    enabled: false
    btc_break_above_usd: 80000
    btc_break_below_usd: 75000
  regime_feed:
    regime_log: data/calibration/market_regime.jsonl
    max_snapshot_age_sec: 1800
  exit_rules:
    enabled: true
    take_profit_pct: 0.3
    stop_loss_pct: 0.3
    max_hold_hours: 72
    updown_stop_cents: 0.03
    updown_exit_window_mins: 2.25
    updown_max_hold_mins: 18.0
    updown_stop_loss_pct: 0.15  # 2026-06-16 revert-to-0613: widened stop rolled back
    updown_hold_winners_to_resolution: false
    stop_use_executable_price: false
    realistic_paper_fills: false
    # 2026-06-16 phantom-stop guard: the fast exit loop prices held positions off
    # the CLOB YES book mid. On thin up/down binaries near expiry a ONE-SIDED book
    # (lone bid e.g. 0.145 vs true ~0.505) fired phantom stops. Require a two-sided
    # book + sane spread before trusting the mid for an EXIT; else skip that market
    # this tick (scan-loop Gamma price + next healthy book tick re-evaluate it).
    exit_require_two_sided_book: true
    exit_max_book_spread: 0.30
    # 2026-06-17 one-ruler fix: mark exits/stops off the SAME CLOB /midpoint the
    # scanner uses for entry, instead of a hand-rolled (best_bid+best_ask)/2 off the
    # book. The cross-ruler mismatch (book mid vs Gamma vs entry midpoint) cut BUY_NO
    # winners with phantom stops — stopped −$4.59/−$3.94 on markets that resolved
    # +$17.80/+$30.92 (validated on trades_settled.held_pnl). Book still drives the
    # two-sided/spread guard + liquidity; only the mark value switches.
    exit_mark_use_clob_midpoint: true
    # Require N consecutive triggering ticks before the % stop fires (3s cadence ->
    # ~6s confirm). Stops a single noisy book read from cutting a winner. 1 = legacy
    # fire-on-first-tick.
    updown_stop_confirm_ticks: 2
    # Phantom-exit floor: refuse the EARLY % stop/TP on an up/down position held
    # fewer than this many seconds (late-window cents/time/expiry stops are NOT
    # gated). 2026-06-17 audit: every phantom exit was a 3–41s hold (impossible
    # 28–52% moves); every correct exit was 14–30 min — 60s cleanly separates them.
    updown_min_hold_sec_before_pct_exit: 60
    bid_depth_exit:
      enabled: false
      mode: observe
      min_bid_depth_usd: 150
      depth_levels: 3
      only_when_losing: true
