    # 15m candle: widened from 13.0-14.33 (1.3min) to 12.0-14.5 (2.5min)
    # Main loop runs on fixed cadence; keep the window wide enough to survive scanner/API latency.
    # May 2026: cap 15m max — paper showed thin-edge entries with huge mins_left → time-stop bleed.
