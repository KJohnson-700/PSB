    # 2026-08-15 BTC STARVATION FIX — the gate was the cause, measured not guessed.
    # htf_bias came back NEUTRAL on 100% of 4,643 evals and neutral_bias was 63.1% of all
    # BTC rejections. Cause: |4H MACD hist| has p50 15.3 (n=355,133 live observations), so
    # a fixed bar of 35 forced 87.7% of ALL directional reads to NEUTRAL. Caught live in the
    # 02:45 boot log: raw_bias=BULLISH, 2 bull votes, hist=8.84, hist_conviction_ok=false.
    #
    # The threshold is now a PERCENTILE of the histogram's own recent distribution, because
    # |hist| is denominated in price units and its scale moves with price/volatility (p25 9.2
    # -> p90 63.0 = a 30x spread in one sample). Any fixed number is a tape-blind gate: it
    # starves BTC in a quiet tape and admits everything in a loud one. p25 => ~25% downgraded
    # whatever the tape does, and the absolute bar self-adjusts.
    min_4h_hist_percentile: 25.0
    # 40, not 100. MEASURED: only 16.5% of gate evaluations are a CHANGE in |hist| (58,720 of
    # 355,989), and live fill runs ~2.6 distinct values/min — so a 100-sample window takes ~40
    # min to warm, and the window is in-memory, so EVERY process start spends that long on the
    # non-adaptive fallback. 40 warms in ~15 min and still puts ~10 observations in each
    # quartile, which is enough for a p25. Cold behaviour is the approved 20.0 bar either way,
    # so the only thing a shorter warm-up changes is how quickly the gate starts tracking tape.
    min_4h_hist_percentile_min_samples: 40
    # COLD-START + FAILURE FALLBACK (used until the window reaches min_samples, and if the
    # percentile is ever 0/invalid). 35 -> 20 RESTORES the operator's own 2026-08-02 GO:
    #   "was 35 — the [20,35) band downgraded a DECIDED 2/3-vote bias to NEUTRAL, sitting BTC
    #    out 7489x this session. LIVE PROOF: 4H hist=+21.9 BULLISH-by-vote knocked to NEUTRAL
    #    by the 35 bar -> 0 aligned longs in a bull. 20 = the alt standard."
    # That change was approved, shipped, and then silently regressed back to 35 — the same
    # regression class as proven_lane_max_usd. 20 also matches btc_min_4h_hist_magnitude on
    # every alt. Codex P1: cold/failed adaptive must never be LOOSER than the last approved
    # gate, so the fallback is 20 rather than a fresh number.
    min_4h_hist_magnitude: 20
