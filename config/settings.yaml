    # ── [1h] Simple consensus-follow BUY_YES lane (DEFAULT OFF — forward-test) ──
    # Ghost evidence (rejected_candidates_settled, BTC 1h BUY_YES, binary payout):
    #   entry 0.50-0.85 → 732 trades, 65.8% WR, +$71.38  (+$0.098/trade)
    #   current gated   → 130 trades, 76.9% WR, -$1.02   (prettier, unprofitable)
