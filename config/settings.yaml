lane_calibration:
  enabled: true
  shadow_mode: false
  paper_shadow_mode: false
  live_shadow_mode: false
  posterior_version: lane_identity_v2_source_resolver
  min_samples_to_apply_live: 30
  beta_veto_max_mean: 0.0
  beta_veto_min_n: 0
  # Corrected bias-SHIFT pull-to-beta (rebuilt 2026-06-03). The 2026-05-29
  # version (e665c6e) blended toward a per-lane constant with weight→1.0 and
  # collapsed within-lane discrimination — disabled same day. This version adds
  # a bounded per-lane OFFSET (p += w*(beta_target_yes-0.5)) that preserves the
  # per-signal spread while correcting/flipping systematic directional error.
  beta_blend_enabled: false  # 2026-06-04: disabled — β-blend inflates BUY_YES edge +0.058→+0.219 (~4×), manufacturing ~457 losing longs/era @42% WR (below breakeven); removal = clean win (induced held-WR 44% < base 46%). Forward-test; re-enable to revert. α-shrink + per-lane veto/flip unaffected.
  beta_blend_n_floor: 30
  beta_blend_n_full: 100
  beta_blend_w_max: 0.60     # cap on shift weight — never reaches collapse regime
  beta_blend_min_bias: 0.05  # ignore directional lean smaller than this
  per_lane_thresholds:
    enabled: true
    recompute_on_settle: true
    recompute_min_new_settles: 25
    min_bucket_n: 50
    wr_veto_threshold: 0.4
    recommended_max_mean: 0.4
    live_mature_n: 50
    flip_min_n: 80          # min samples before a lane is eligible to flip
    flip_wr_max: 0.40       # chosen-side WR at/below this (with neg live PnL) → flip
    path: data/calibration/lane_thresholds.json
  # Posterior-driven side flip. When a lane's chosen side reliably loses at high
  # sample (flip_recommended in lane_thresholds.json), trade the OPPOSITE side
  # instead of vetoing. est_prob is side-independent P(UP); the flipped side must
  # still clear the normal edge gate (with β-corrected est_prob). Default OFF —
  # opt in after watching β-blend stop the bleed. Forward-test only.
  directional_flip:
    enabled: false  # 2026-06-04: disabled — posterior-driven side flips fire on ~0.50-AUC noise and don't recompute est_prob; suspected contributor to inverted (short-into-rising) sides. Forward-test; re-enable to revert.
lane_exit_policy:
  enabled: true
  alert_discord: true
  recompute_min_new_settles: 25
  min_lane_n: 5
entry_policy:
  defaults:
    enabled: true
    hard_min_edge: 0.0
    ai_override_min_edge: 0.0
