polymarket:
  api_endpoint: https://clob.polymarket.com
  graphql_endpoint: https://graphql.polymarket.com/matic
  ws_endpoint: wss://ws-subscriptions-clob.polymarket.com/ws
  network: polygon
  chain_id: 137
  min_liquidity: 10000
  max_spread: 0.05
  scanner_sync_timeout_sec: 35
  fetch_hype_alt_markets: true
  gamma_http_max_retries: 3
  gamma_http_retry_backoff_base_sec: 0.5
  creds_max_age_hours: 144
  auto_rederive_credentials: true
  rederive_credentials_on_start: true
  signature_type: 3
  funder_address: '0x7d81246BbE1e91f84f5A791D56fb1865545D78A9'
hyperliquid:
  request_timeout_sec: 8
  range_request_timeout_sec: 12
  connect_timeout_sec: 3
  max_retries: 2
  retry_backoff_base_sec: 0.5
  stale_on_error_max_age_sec: 180
  hl_mid_ttl_sec: 5
final_window_topup:
  shadow_enabled: true
  final_window_max_mins: 1.0
  winner_mark_threshold: 0.95
  max_oracle_basis_bps: 25.0
  max_topup_price: 0.99
  sampler_enabled: true
  sampler_window_mins: 1.5
trading:
  persistent_session: false
  cycle_interval_sec: 30   # 2026-08-11 60->30 (the built-in floor is max(30,...) at main.py:1199): 2x scan frequency so assets don't go quiet / pre-window entries aren't missed. SAFE now because the window-boundary slug cache means the extra cycles REUSE the 5m/15m lists instead of re-fetching gamma, and HYPE-alt has its own ~55s throttle below so its fragile fetch load does NOT increase. Revert to 60 to restore.
  hype_alt_fetch_min_interval_sec: 55   # 2026-08-11 decouple HYPE-alt's fragile fetch from loop speed: fetch at most every ~55s regardless of cycle_interval, reuse cache between. 0 => fetch every cycle (legacy). Requires scanner_slug_cache_enabled.
  exit_check_interval_sec: 3
  ws_candle_feed:
    enabled: true
  execution_provider: clob
  entry_mode: hybrid
  entry_maker_wait_sec: 8
  entry_hybrid_windows:
  - 15m
  - 1h
  exit_mode: hybrid   # MAKER-FIRST EXITS 08-07: route non-urgent 15m/1h exits maker-first (0-fee); urgent/stop stay FAK
  exit_hybrid_windows:
  - 15m
  - 1h
  microstructure_enrichment_enabled: false
  microstructure_trade_flow_window_sec: 300
  crypto_hourly_scan_every_n_cycles: 3
  overrun_recovery_sleep_sec: 5
  # 2026-08-11 WINDOW-BOUNDARY SLUG CACHE: reuse the 5m/15m updown market LIST within a
  # window instead of re-fetching from gamma every ~60s cycle (the dominant non-analysis
  # cost + source of slug-fetch timeouts). Re-fetch only when the window bucket advances or
  # the max-age backstop trips; prices stay live on the separate WS/midpoint path. Set
  # enabled:false for byte-identical legacy behavior. Max-age = window + 60s buffer by default.
  scanner_slug_cache_enabled: true
  scanner_slug_cache_max_age_15m_sec: 960   # 15m window + 60s; boundary is the primary trigger
  scanner_slug_cache_max_age_5m_sec: 360    # 5m window + 60s
  dry_run: true
  # 2026-08-08 PAPER SLIPPAGE EQUIVALENT (operator: "paper equivalent to the slippage shit"). ON.
  # On a paper BUY the entry is FRESH-FILLED against the REAL ask book (clob_client.py:1445):
  # fetch book -> sweep asks -> fill at the depth-weighted price (what live pays), and NO-FILL the
  # trade if the book is too thin (return None, exactly like live can't fill). Closes the paper->live
  # ENTRY slippage gap with zero real money. Exits are hold-to-resolution (settle $1/$0, no book sale)
  # so entry is the only slippage exposure. Expect: worse entry prices + some no-fills => lower freq,
  # tighter per-trade edge = the honest live picture. RESTART-CLASS (clob_client __init__). false => off (fill at quote).
  paper_entry_fresh_fill: false
  paper_entry_fresh_fill_slippage_tol: 0.02   # how far past the signal price it will sweep before NO-FILL (2c)
  slippage_guard:
    enabled: true
    mode: enforce
    apply_in_paper: true
    paper_mode: observe
    max_slippage_cents: 0.02
    max_spread_cents: 0.10   # 2026-08-15 LOOSENED 0.05 -> 0.10 for the live smoke (operator).
    # PICKED FROM THE BOOK, NOT A GUESS. Real spread at entry, n=4,458 (entry_book_shadow):
    #   p50 0.010  p75 0.030  p90 0.070  p95 0.110  p99 0.260  max 0.740
    # Share of real entries the cap would BLOCK:
    #   0.03 -> 21.3%  (the value that STARVED live 2026-07-28: signals fired, 0 entries)
    #   0.05 -> 12.4%  (previous)
    #   0.10 ->  5.2%  (this)      0.12 -> 3.4%   0.15 -> 2.4%
    # THE MAKER ARGUMENT, which is why this is not merely "loosen and hope": the cap was
    # calibrated for a TAKER, where a wide spread is a cost you pay. entry_mode is hybrid —
    # we REST post_only inside the spread for entry_maker_wait_sec before crossing. For a
    # maker, a wide book is where the edge IS, not a hazard: you post inside it and get paid
    # to wait. Blocking wide spreads is therefore backwards for a maker-first run, and the
    # smoke exists precisely to measure maker economics (50% of live entries / 67% of exits
    # already fill maker, order_lifecycle.jsonl n=63).
    # RESIDUAL RISK, deliberately kept: if the maker leg does NOT fill in 8s it crosses FAK
    # and pays the full spread. 0.10 still blocks the p95+ tail (0.11 and up, incl. the 0.26
    # p99 and 0.74 max) so genuinely broken books are still refused. Not going past 0.12
    # without live fill data. Hot-reloadable (slippage_guard is in _HOT_RELOAD_TRADING_KEYS,
    # main.py:127) and live-only — paper_mode: observe, so this changes nothing in paper.
    require_full_depth: false
    depth_price_ceiling_cents: 0.02
  clob_ws:
    enabled: true
    ws_app_ping_sec: 10
    book_channel: market
    subscribe_interval_sec: 30
    asset_ids_json_key: assets_ids
    drive_scanner_prices: true
    price_max_age_sec: 8
    subscribe_universe: true
    universe_subscribe_cap: 250
    rest_book_price_fallback: true
  default_position_size: 6
  max_position_size: 40   # 2026-08-10 KEEP 40 as the CEILING (operator caught: 25 would clamp the proven winning lanes). $40 is the HARD CAP; base bets stay Kelly-small; the SELECT WINNING lanes reach $35-40 via adaptive_sizer.proven_lane_max_usd (40) + lane_max_usd (bitcoin15mYES 35, bnb15mNO/xrp15mNO 40, ...). +869 geometry = achieved via KILLING the favorite lane (risk.favorite_lane_enabled:false), NOT by capping the winners. Do NOT drop to 25 — it strangles the winning-lane sizing.
