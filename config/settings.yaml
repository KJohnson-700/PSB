risk:
  # 2026-08-12 BLEED-HOUR SIT-OUT (operator GO). Skip UP/DOWN entries during PT hours measured
  # as the concentrated bleed across ALL history: 17:00 -$220, 18:00 -$174, 19:00 -$357 (36%WR)
  # = -$751 combined, vs a flat-to-positive rest of the clock. NOT a fixed trading schedule —
  # it is a measured per-hour sit-out; re-measure and shrink/drop it as the data moves.
  # Empty list [] => OFF (fail-open). Hot-reloadable (risk is a hot-reload top-level key).
  blocked_pt_hours: []          # MANUAL pin list (unioned with the adaptive set). Emptied
                                # 2026-08-12 now that hour_adapter measures this from realized
                                # pnl — keep [] unless you want to force an hour by hand.
  hour_adapter:                 # 2026-08-12 ADAPTIVE per-hour sit-out (operator: "no set
                                # trading times — must be ADAPTIVE"). Scores each entry-hour on
                                # rolling REALIZED $/trade over the RECENT era and self-flips:
                                # sits an hour out while it bleeds, restores it when it recovers.
    enabled: true
    lookback_sessions: 40       # recent-era window. 40 chosen by sweep: 10 gave n<15 in nearly
                                # every hour (fail-open, gated nothing); 40 yields ~890 closes and a
                                # STABLE outlier set (01/05/22 PT reproduce at 60 too).
    min_samples: 25             # closes needed in an hour before it may be gated (else fail-open)
    sit_out_delta: -1.50        # hour avg $/trade THIS FAR BELOW the same-era baseline => sit out
    recover_delta: -0.50        # ...stays out until it climbs back above this (hysteresis)
    max_blocked_hours: 4        # HARD frequency floor: never gate more than N hours (worst first)
    refresh_sec: 900
  favorite_lane_enabled: true   # 2026-08-13 RE-ENABLED FOR ONE RESTART (operator: "turn xrp 1h and hype 15m favorites back on just for this restart to see how it goes and kill the 15m book"). This is the switch that ACTUALLY wins (sol_macro.py:7724 checks it first and returns [] regardless of favorite_lane.enabled). SCOPED: favorite_lane.allow_lanes = ["xrp_macro|1h","hype_macro|15m"] so ONLY those two fire — the whole 15m book (sol -$170, doge -$156, bnb -$117, xrp -$83) and BTC's favorites stay dead. REVERT = set false (hot-reloadable, no restart). Prior kill rationale still stands for everything OUTSIDE the allowlist:  # 2026-08-10 KILL THE FAVORITE LANE (operator: revert to +869 winning config, which had NO favorite lane). Favorites 0.85+ = win-11%/lose-90% payoff-trap, b=0.13, need 88% WR, −$448 all-time. Under `risk` = HOT-RELOADABLE (no restart). Set true to re-enable. Read by sol_macro + bitcoin _favorite_lane_signals.
  rsi_fade:                # 2026-08-10 RSI-GATED COINFLIP FADE (operator GO — the MEASURED >coinflip edge, project_rsi_fade_edge_found_2026_08_10). Under `risk` so it's HOT-RELOADABLE => REVERT TRIGGER = flip enabled:false (no restart) if fade-WR < breakeven. Read by sol_macro._resolve_alt_bias_for_tf (shared by ALL alts + eth): fades the direction-lane side when RSI < rsi_below AND trend NOT fully-aligned (align-gate = regime safety; fading a strong aligned trend gets run over). Favorites bypass the resolver = UNAFFECTED. Measured: RSI<40 native 30%WR => FADE 69.6% (4 sessions, never <56%). rsi_above 101 = overbought-fade OFF (ship strongest zone first). side_source retagged *_rsi_fade for attribution/monitoring.
    enabled: false   # 2026-08-12 EMERGENCY CUT: current config still had RSI fade ON; clean baseline since 20260811_2059 shows rsi_fade families net -$68.85, led by BTC 15m rsi_fade -$54.38 and BNB 15m rsi_fade -$36.59. Hot-reloadable.
    rsi_below: 40.0
    rsi_above: 101.0
    windows: [1h]   # 2026-08-13 CORRECTED — the 08-12 edit kept exactly the wrong half. Scored vs REAL resolutions (Aug10-13 settled ghosts, restricted to the 0.45-0.55 toss-up band where the quote carries no direction): 1h 68.6% right (n=2143) | 5m 51.5% (n=357, coinflip) | 15m 37.6% (n=853, INVERTED). Per lane the split is the same signal flipping sign by timeframe: eth 1h 77.4% (n=1121) vs eth 15m 22.2% (n=487); xrp 1h 60.2% (n=926). Live agrees — the only rsi_fade that ever traded live was btc_15m_rsi_fade: n=32, WR 34.4%, -$88.61. So the 08-12 "dropped 1h, kept 5m/15m" removed the ONLY window with edge and retained the two without, and the emergency cut that followed (enabled:false, "-$68.85 led by BTC 15m -$54.38 / BNB 15m -$36.59" — both 15m) was killing a feature that had already had its working half removed. Oversold-fade is a 1h phenomenon: on 1h oversold mean-reverts, on 15m it keeps falling. rsi_above 101 still parks the overbought arm OFF. STILL DORMANT (enabled:false) — this only fixes where it points; turning it on is a separate operator call.
    flat_edge: 0.05          # 2026-08-10 fade sizes on THIS flat edge, NOT est_prob (which is anti-predictive in the band). The fade is exempted from lane_min_edge + est_prob conviction floors (sol_macro scan loop) because est_prob-edge is ~0/NEGATIVE by construction on the faded side => without this the fade takes ZERO trades (measured: 74 resolutions -> 0 fills). Conservative 0.05 (below alt_1h_simple_long 0.06). Hot-reloadable. Set higher to size faded bets up once WR confirms.
  max_concurrent_positions: 50   # 2026-08-08 NOW HOT-RELOADABLE (operator): raise/lower the max simultaneous OPEN trades in settings.yaml and it applies live WITHOUT restart (can_trade reads it from self.config each check; "risk" is in _HOT_RELOAD_TOP_LEVEL_KEYS). NOTE: 50 is high vs a $1k bankroll at $70/favorite — lower it here anytime to cap concurrent exposure. Per-strategy override: strategies.<name>.max_concurrent_positions.
