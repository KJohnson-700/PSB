polymarket:
  api_endpoint: https://clob.polymarket.com
  graphql_endpoint: https://graphql.polymarket.com/matic
  ws_endpoint: wss://ws-subscriptions-clob.polymarket.com/ws
  network: polygon
  chain_id: 137
  min_liquidity: 10000
  max_spread: 0.05
  scanner_sync_timeout_sec: 35
  fetch_hype_alt_markets: true
  gamma_http_max_retries: 3
  gamma_http_retry_backoff_base_sec: 0.5
  # ── L2 credential lifecycle (live execution only; ignored while dry_run) ──
  # Derived Polymarket L2 creds expire ~7 days after derivation, do not rotate,
  # and fail SILENTLY with auth errors. See src/execution/clob_client.py.
  creds_max_age_hours: 144          # treat creds older than 6d as stale (under 7d expiry)
  auto_rederive_credentials: true   # self-heal: re-derive from L1 signer instead of refusing
  # ON when live: force an idempotent L1 re-derive at every boot so the bot
  # always starts with freshly minted creds (set_credentials only records when
  # we LOADED the .env creds, not their true age). Only consulted in live mode —
  # paper boot short-circuits before reading it. See second-brain changelog
  # 2026-06-11 "L2 credential lifecycle hardening".
  rederive_credentials_on_start: true
  # ── CLOB V2 proxy/Safe execution (live only; ignored while dry_run) ──
  # Polymarket V2 (prod since 2026-04-28) REJECTS raw-EOA orders ("maker address
  # not allowed", py-clob-client-v2 #51). Website accounts hold funds in a proxy
  # wallet, so live orders must carry the account's signature type + funder.
  #   signature_type: 1 = POLY_PROXY (email / Magic.link signup)
  #                    2 = POLY_GNOSIS_SAFE (browser-wallet signup)
  # funder_address: your Polymarket proxy/deposit wallet address (NOT the EOA the
  #   private key derives) — find it on your Polymarket profile / deposit page.
  # FILL THESE IN BEFORE THE LIVE SMOKE TEST. They are unused while dry_run=true.
  signature_type: 1               # POLY_PROXY — email/Magic.link account (confirmed 2026-06-13)
  funder_address: "0x932845f226ffb93ec14d37add977446cf0d8a6eb"  # Polymarket proxy wallet (verified ≠ signer EOA 0x477B…3811)
hyperliquid:
  request_timeout_sec: 25
  range_request_timeout_sec: 30
  connect_timeout_sec: 5
  max_retries: 4
  retry_backoff_base_sec: 0.5
  stale_on_error_max_age_sec: 180
trading:
  cycle_interval_sec: 60
  exit_check_interval_sec: 10
  # Execution provider for live orders. "clob" uses direct Polymarket CLOB V2;
  # "olympus" uses the Olympus Trading API adapter. Paper mode still stays local.
  execution_provider: clob
  # Entry fill mode. true = marketable (taker/FAK): entries fill immediately like
  # paper assumes, so calibration transfers to live and the frequency-based design
  # actually trades — at the cost of the taker fee (charged round-trip in paper).
  # false = maker (post_only/GTC): 0 fee but rarely fills in fast up/down markets.
  entry_marketable: true
  microstructure_enrichment_enabled: false
  microstructure_trade_flow_window_sec: 300
  crypto_hourly_scan_every_n_cycles: 3
  overrun_recovery_sleep_sec: 5
  dry_run: true
  # ── Pre-order fresh-book slippage guard (live execution only; no-op in dry_run) ──
  # Between scan and place_order the CLOB book can move. Before placing a BUY
  # (BUY_YES / BUY_NO) we re-read the live book for the token and compare best_ask
  # to the price we're about to send (signal.price). Default mode is OBSERVE: log
  # how far the ask moved without suppressing, so the first live run records real
  # slippage before any threshold suppresses fills. Flip mode->enforce (and tune
  # max_slippage_cents) once the live smoke test shows real numbers. Fail-OPEN on
  # any missing book / read error. See src/main.py _fresh_book_slippage_ok.
  slippage_guard:
    enabled: true
    mode: observe            # observe | enforce
    max_slippage_cents: 0.02
  clob_ws:
    enabled: true
    book_channel: market
    subscribe_interval_sec: 15
    asset_ids_json_key: assets_ids
  default_position_size: 15
  max_position_size: 25
  max_days_to_resolution: 365
  min_hours_to_resolution: 1
  max_exposure_per_trade: 0.05
  max_topic_exposure: 0.2
  daily_loss_limit: 0.15
  kelly_fraction: 0.37
  regime:
    enabled: false
    btc_break_above_usd: 80000
    btc_break_below_usd: 75000
  # Regime-feed config only. The standalone price-tracker feed supports
  # dashboard health/segmentation and does not gate any entry.
  regime_feed:
    regime_log: data/calibration/market_regime.jsonl
    max_snapshot_age_sec: 1800
  exit_rules:
    enabled: true
    take_profit_pct: 0.3
    stop_loss_pct: 0.3
    max_hold_hours: 72
    updown_stop_cents: 0.03
    updown_exit_window_mins: 2.25
    updown_max_hold_mins: 18.0
    updown_stop_loss_pct: 0.2
    updown_hold_winners_to_resolution: false
    # ── Executable-price stop (default OFF) ──
    # Evaluate the updown stop trigger on the exit-side price we'd actually realize
    # (YES bid for long YES; 1-ask i.e. NO bid for long NO; YES ask for short YES)
    # instead of the YES midpoint, and fill there. Measured ~$190/2d gap: the stop
    # fires at mid -15% but the live fill gaps to the bid (-28% median, -45% in the
    # last 2 min to resolution). Marking the stop on the executable price fires it at
    # a true -15% and fills near there. EXIT change — not ghost-validatable; forward-
    # test on trades_settled + exit_excursion_shadow. Fail-safe to midpoint if no book.
    stop_use_executable_price: true
    # ── Realistic paper fills (default OFF) ──
    # Paper/dry_run fills every order at the requested price (no spread, slippage,
    # or depth), so paper exit P&L is optimistic vs live. When on, exits are filled
    # by walking the order-book ladder from the snapshot (size-weighted, remainder
    # padded at the deepest level) so recorded paper P&L reflects a real sweep:
    # long-YES sells the YES bids, long-NO sells the NO bids (= YES asks mirrored),
    # short-YES buys back the YES asks. Entries still fill at the mark (next
    # increment). Flip on to start collecting realistic paper data and measure the
    # paper->live fill haircut. See src/execution/fill_sim.py.
    realistic_paper_fills: true
    # ── BUY_YES bid-depth deterioration exit (default OFF) ──
    # Closes a long-YES position when sell-side support (YES bid depth) collapses
    # while the position is non-positive and there is still real time left — fixes
    # "held too long into a thinning book" WITHOUT WebSocket infra (reuses the book
    # snapshot the fast-exit loop already fetches). DEFAULT OFF + mode=observe: this
    # is an EXIT change, which the ghost log CANNOT validate, and an early close on a
    # scratch position is the "stops cut winners" shape. Run observe first, read the
    # logged would-fire rate against real outcomes, THEN consider enforce.
    # See PositionExitManager.check_exits / main.py _fetch_held_market_prices.
    bid_depth_exit:
      enabled: false
      mode: observe            # observe | enforce
      min_bid_depth_usd: 150   # sum($ = price*size) over top N YES bids; below = collapsed
      depth_levels: 3          # top-N bid levels to sum
      only_when_losing: true   # require pnl_pct <= 0
      min_mins_remaining: 5.0  # only fire when MORE than this remains (else time-stop owns it)
    dynamic_stop_enabled: true
    dynamic_stop_bull_mult: 0.95
    dynamic_stop_range_mult: 1.05
    dynamic_stop_bear_mult: 1.15
    dynamic_stop_high_vol_mult: 1.15
    dynamic_stop_volatility_threshold: 0.02
    dynamic_stop_low_convergence_mult: 1.1
    dynamic_stop_high_convergence_mult: 0.95
    dynamic_stop_low_convergence_threshold: 0.55
    dynamic_stop_high_convergence_threshold: 0.75
    updown_exit_window_max_fraction: 0.5
    updown_high_entry_threshold: 0.6
    updown_stop_cents_high_entry: 0.02
    updown_in_profit_stop_trigger_pct: 0.0
    updown_in_profit_stop_tighten_to_pct: 0.0
    # ── Regime-conditioned exits (DISABLED) ──
    # Historical experiment only. Operator direction as of 2026-06-12: do not
    # reintroduce hold-to-resolution/hold+trail exits unless explicitly requested.
    # Keep simple TP/stop behavior as the default exit model.
    regime_conditioned_exits:
      enabled: false
      trend_side_hold_winners: false
      trend_side_trail_arm_pct: 0.10
      trend_side_trail_gap_pct: 0.15
      off_trend_force_tight: true
      # BTC is exempt: it ALWAYS takes profit at its TP (never forced to hold).
      # Regime-hold is for the alts, where held-vs-realized data supported riding
      # the trend-side move. Entries are "strategy" (all windows) or "strategy|window".
