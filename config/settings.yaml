monitoring:
  # 2026-08-15 RSS GUARD. Nothing watched the bot's own memory before this: no ceiling,
  # no alarm, no page — the only backstop was macOS Jetsam, i.e. the operator beachballs
  # first and finds out after. That is the 2026-06-18 shape (678MB -> 4.7GB in one
  # interval, stuck ~5GB until Jetsam).
  #
  # Thresholds are set off MEASURED steady state, not guesses: RSS plateaus ~990MB
  # (sawtooth 957-990 held over hours). warn 1400 is ~40% above that plateau so normal
  # operation never trips it; critical 1800 still leaves headroom below the 4.7GB event.
  # Hot-reloadable via _rebuild_runtime_config_dependents — retune without a restart.
  #
  # It ALARMS, it does not kill. An unattended process must not decide by itself to stop
  # trading the book; it relieves allocator arenas, logs, and pages a human.
  rss_guard:
    enabled: true
    warn_mb: 1400
    critical_mb: 1800
    warn_repage_sec: 1800      # persistent-state backoff, NOT fire-once-on-transition
    critical_repage_sec: 300
    page_enabled: true
    page_target: "Oracle 2"    # operator moved ops alerts off the Hermes DM
