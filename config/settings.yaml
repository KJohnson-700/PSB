      ai_override_min_edge: 0.1
    by_tf:
      5m:
        min_edge: 0.08
        entry_window_min: 0.5
        entry_window_max: 5.5
      15m:
        min_edge: 0.09
        entry_window_min: 2.0
        entry_window_max: 19.0
      1h:
        min_edge: 0.09
        entry_window_min: 1.0
        entry_window_max: 59.0
    min_edge_15m_neutral: 0.12
    neutral_15m_min_quant_confidence: 0.58
    neutral_15m_requires_shadow_portfolio: true
    neutral_15m_min_composite_score: 0.68
    neutral_rsi_min: 45.0
    neutral_rsi_max: 55.0
    neutral_rsi_extra_min_edge: 0.02
    min_4h_hist_magnitude: 35
    max_edge_updown: 0.12
    max_edge_updown_15m_short: 0.18
    max_edge_updown_1h_short: 0.23
    ai_confidence_threshold: 0.6
    # 2026-06-09: NEUTRAL is the regime the AI is meant to decide. Route ALL
    # below-threshold NEUTRAL 15m/1h candidates to the AI (not just low-confidence
    # ones) so a flat-4H night keeps trading with the AI choosing the side instead
    # of starving at the lane_min_edge gate. Budget 3->5 so a NEUTRAL night with
    # several open 15m/1h markets actually gets AI on each. 5m unchanged (no AI).
    # Opt-out: neutral_15m_routes_to_ai: false.
    neutral_15m_routes_to_ai: true
    max_ai_calls_per_scan: 5
    ai_call_timeout_sec: 15
    # 2026-06-09: decision-gate timeout 40->90s. The marginal/NEUTRAL gate is the
    # ONLY place MiniMax fires for BTC, and only on 15m/1h windows that are
    # minutes-long — give the call room to actually return a verdict instead of
    # cancelling at 40s (MiniMax p50 ~18s but the tail runs longer). Still < the
    # provider HTTP timeout (120s). btc_marginal_failopen_on_ai_timeout still
    # catches a genuine timeout (quant decides, trade not dropped).
    ai_decision_timeout_sec: 90
    use_ai_updown_5m: false
    # 2026-06-09 ROBUSTNESS: on AI timeout for a borderline BTC marginal, fall
    # through to the quant edge-gate instead of dropping the trade (the 06-01/02
    # ~400-trade timeout-starvation fix). Quant still decides; set false to revert.
    btc_marginal_failopen_on_ai_timeout: true
    use_ai_updown: true
    ai_updown_marginal_min_edge: 0.03
    ai_hold_veto_ttl_sec: 300
