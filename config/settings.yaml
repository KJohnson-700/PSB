        - "xrp_macro|5m|down"
        - "eth_macro|5m|down"
        - "sol_macro|1h|down"
        - "xrp_macro|1h|down"
        - "bitcoin|1h|down"
        - "doge_macro|5m|up"
        - "xrp_macro|5m|up"
        - "bnb_macro|15m|down"
        - "eth_macro|1h|up"
    stop_loss_pct: 0.3
    max_hold_hours: 72
