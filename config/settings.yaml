olympus:
  base_url: https://api.olympusx.app
  timeout_sec: 20
  live_order_approved: true
  await_fill_on_submit: true
  fill_poll_attempts: 12
  fill_poll_interval_sec: 1.0
  smoke_test:
    enabled: true
    max_order_usd: 15         # hard ceiling; orders over this hard-fail at submit
    max_orders_per_run: 40
    require_market_slug: true
    require_condition_id: true
    # Live-order sizing only. Paper trades keep full Kelly (trading.max_position_size).
    # When on, live BUYs are proportionally shrunk from [0, max_position_size] into
    # [scale_floor_usd, max_order_usd] so they still scale with conviction but clear
    # the cap. Live band here = $5 floor .. $15 ceiling.
    scale_live_sizing: true
    scale_floor_usd: 5.0
    true_max_usd: 25         # 2026-06-15: live smoke-band scaling denominator (NOT a live order cap — that is max_order_usd: 15). Kept at 25 so realistic conviction (~$8-$25) spans the [$5,$15] band with decent granularity; >$25 conviction caps at $15.
lane_management:
  enabled: true
  execution_enforcement_enabled: false
  default_state: paper
  states: {}
  state_meta: {}
  recommendations:
    min_live_trades: 15
    min_live_win_rate: 0.54
    min_live_expectancy: 0.0
    max_live_gap: 0.04
    min_pause_trades: 8
