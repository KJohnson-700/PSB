polymarket:
  api_endpoint: https://clob.polymarket.com
  graphql_endpoint: https://graphql.polymarket.com/matic
  ws_endpoint: wss://ws-subscriptions-clob.polymarket.com/ws
  network: polygon
  chain_id: 137
  min_liquidity: 10000
  max_spread: 0.05
  scanner_sync_timeout_sec: 35
  # 2026-07-27 STARVATION FIX (S1, Codex GO, HOT): hype_macro.enabled=false (settings.yaml ~1300)
  # so the HYPE strategy can't trade, yet this flag forced a slow ~13-slug hype_alt fetch every
  # cycle producing 0 rows — dead load eating a sync-pool slot + slug-pool budget and starving the
  # slower windows (hype_alt/1h). Off = frees that budget. ⚠️ RE-ENABLE this (set true) if you ever
  # set hype_macro.enabled=true again — this flag overrides strategy enablement (_should_fetch_hype_alt_markets).
  fetch_hype_alt_markets: false
  gamma_http_max_retries: 3
  gamma_http_retry_backoff_base_sec: 0.5
  creds_max_age_hours: 144
  auto_rederive_credentials: true
  rederive_credentials_on_start: true
  signature_type: 3
  funder_address: '0x7d81246BbE1e91f84f5A791D56fb1865545D78A9'
hyperliquid:
  request_timeout_sec: 8
  range_request_timeout_sec: 12
  connect_timeout_sec: 3
  max_retries: 2
  retry_backoff_base_sec: 0.5
  stale_on_error_max_age_sec: 180
  hl_mid_ttl_sec: 5
final_window_topup:
  shadow_enabled: true
  final_window_max_mins: 1.0
  winner_mark_threshold: 0.95
  max_oracle_basis_bps: 25.0
  max_topup_price: 0.99
  sampler_enabled: true
  sampler_window_mins: 1.5
trading:
  persistent_session: false
  cycle_interval_sec: 60
  exit_check_interval_sec: 3
  # Position reconciler (2026-07-27): syncs the bot's open positions against the
  # ACTUAL Polymarket account (Data API) so manual closes / resolutions / phantom
  # entries never orphan a position or mis-count. interval=how often to reconcile;
  # grace=don't drop a fill younger than this (Data-API index lag); confirm_rounds=
  # consecutive absent snapshots required before a destructive drop (Codex: 3 for a
  # conservative first live run, protects against a multi-snapshot Data-API blip).
  position_reconcile_interval_sec: 120
  position_reconcile_grace_sec: 120
  position_reconcile_confirm_rounds: 3
  ws_candle_feed:
    enabled: true
  execution_provider: clob  # 2026-07-30 SWITCHED to direct CLOB (operator GO): Olympus 403-region-blocks POST /v1/trade; funds withdrawn Olympus->Polymarket (SDK-confirmed $195.33 on deposit wallet 0x7d81 sig_type3). CLOB region-clear from the VPN IP. Olympus code now dormant.
  # 2026-07-30 FEE-AWARE EDGE gate ENABLED for direct CLOB (operator GO; research: vault + web both confirm
  # Polymarket crypto TAKER fee = 0.07, fee = shares*0.07*p*(1-p), peaks ~1.8% at p=0.50; maker = 0%).
  # fee_util.fee_aware_edge_hurdle() (already built, wired in sol_macro:6248 + eth_macro:2766 — sol-family+eth,
  # NOT btc) subtracts this hurdle from raw edge before min_edge so admission is NET-of-fee. Was inert (block
  # absent -> returns 0.0). fee_legs=1.0 = ENTRY-taker leg only (the exit leg is to be eliminated structurally
  # via maker-first exits, not gated harder here). olympus rate stays 0.0 so this is a no-op if we ever revert
  # to olympus. RESTART-class (min_edge path reads at scan; verify live). NOTE: raises effective min_edge most
  # at p~0.50 (~1.75%) -> cuts thin-edge mid-price entries (the -EV coin-flip band) = intended.
  fee_aware_edge:
    enabled: true
    taker_fee_rate: 0.07
    olympus_taker_fee_rate: 0.0
    fee_legs: 1.0
  entry_mode: hybrid  # 2026-07-30 (operator GO): maker-first ENTRY (post_only GTC -> FAK fallback) on 15m/1h ONLY; 5m falls back to marketable. 0-fee maker leg saves the ~1.8% taker fee when it fills; guaranteed taker fallback after entry_maker_wait_sec so we never miss a fill. Paper always uses conservative marketable. Infra: clob_client.place_entry_order (Codex-approved). Restart-class (read at entry via _entry_exec_params).
  entry_maker_wait_sec: 8
  entry_hybrid_windows:
  - 15m
  - 1h
  # 2026-07-30 MAKER-FIRST EXITS (operator GO to BUILD; default OFF pending Codex review + restart).
  # exit_mode: marketable (default) keeps today's exact behavior — urgent/loss-cut/near-resolution
  # exits are ALWAYS FAK aggressive-cross regardless of this flag (they can't rest). This flag only
  # governs NON-marketable (take-profit / mark-based) exits on exit_hybrid_windows: hybrid = post_only
  # GTC maker leg (0 fee + rebate) -> wait exit_maker_wait_sec -> cross remainder to FAK to guarantee
  # flatten. Maker exit is the single biggest fee/slippage saver (exit taker fee ~1.8% at mid + the
  # 250ms taker delay + book-walk slippage all eliminated when the maker leg fills). place_exit_order
  # (clob_client) mirrors the Codex-approved entry-hybrid; SELL caps at holdings so no oversell.
  # 2026-07-30 ON (operator GO). Urgent/loss-cut/near-resolution exits STILL FAK aggressive-cross
  # (this flag only governs non-marketable take-profit exits on 15m/1h) so downside is bounded.
  # Codex review runs in parallel; applies on next restart (read at exit via _exit_exec_params).
  exit_mode: hybrid
  exit_maker_wait_sec: 6
  exit_hybrid_windows:
  - 15m
  - 1h
  # 2026-07-30 PAPER-TO-LIVE CALIBRATION Phase 1 (operator plan). Make PAPER a CLOB execution
  # simulator, not a "signal fills at mark" sim. All three flags below only affect PAPER/dry_run
  # (the LiveTestingEngine + clob_client dry_run path) — live uses real venue fills, so they cannot
  # touch live PnL. Code was already built (clob_client:1410 book-walk entry, live_testing:891 exit,
  # live_testing:945 taker fee) and merely switched off. Restart-class (read at engine init).
  paper_entry_fresh_fill: true  # book-walk live-snapshot entry fill; skip if no asks / no executable size / notional<$1; records the walked avg fill instead of the signal mark.
  # 2026-07-30 PAPER CALIB #2: fail-open fills (book snapshot unavailable) are now TAGGED
  # paper_fill_model=signal_price_fail_open in the calibration record (never invisible).
  # Set true for STRICT calibration: treat a missing snapshot as NO-FILL instead of filling
  # at the signal mark (removes the last fake-fill path; costs some paper frequency).
  paper_fresh_fill_no_fill_on_snapshot_fail: false
  microstructure_enrichment_enabled: false
  # 2026-07-30 data-loop A: journal the LIVE maker-first order lifecycle (submit/accept/
  # maker-vs-FAK path/partial/fill/fallback + submit→resolve latency) to
  # data/calibration/order_lifecycle.jsonl. Live-only in practice (paper uses the fresh-fill
  # branch). Fail-safe, one row per resolved order. Set false to disable.
  order_lifecycle_log_enabled: true
  # 2026-07-30 NEAR-WINDOW TRADE MANAGEMENT (operator plan). PHASE 1 = LOGGING ONLY:
  # every lane_entry_window reject is recorded to data/calibration/window_watch.jsonl to
  # diagnose whether near-window 5m/15m markets are checked too early/late/blocked. Fast
  # recheck (P3) stays OFF until the telemetry proves the queue is correct.
  window_watch:
    enabled: true
    log_only: true
    fast_recheck_enabled: false
    recheck_interval_sec: 12
    near_window_buffer_sec: 90
    max_watch_items: 80
    windows:
      - 5m
      - 15m
    strategies:
      - bitcoin
      - sol_macro
      - eth_macro
      - xrp_macro
      - bnb_macro
  microstructure_trade_flow_window_sec: 300
  crypto_hourly_scan_every_n_cycles: 3  # 2026-07-30 restored from +$80 baseline (was 1): live scanner/WS-churn optimization (#7). Restart-class (scanner reads at init/cycle).
  # 2026-07-27 ADAPTIVE SCANNER (Codex-scoped, guarded). scanner_adaptive_slug_order: order
  # DEEPER-lookahead slug fetches by live per-asset signal productivity (EMA) so the inner-fetch
  # timeout cuts unproductive tails, NOT producers. TWO-PHASE: nearest window (offset 0) always
  # canonical = every asset covered each cycle; only offset>=1 reorders. Escape hatch every N
  # cycles reverts to canonical. ON now for paper validation — flip false to disable instantly
  # (config, hot-read). scanner_slug_fetch_timeout_sec = S2 inner per-window slug budget.
  scanner_adaptive_slug_order: true
  scanner_adaptive_escape_every_n: 5
  scanner_slug_fetch_timeout_sec: 25
  # 2026-07-27 ADAPTIVE PER-LANE SIZER (Codex-GO, SHADOW). One realized-P&L-driven
  # size multiplier per lane/side, replacing the scattered/dead sizing knobs.
  # mode: shadow = compute+log the mult it WOULD apply, move ZERO real size
  # (resolve_size_mult returns 1.0). Flip mode: live ONLY after forward-test review
  # + operator GO (Phase 2). Sizes DOWN losers at n>=min_n_down, UP winners only at
  # the stricter n>=min_n_up; recent sessions only (never pooled); EMA-smoothed.
  adaptive_sizer:
    enabled: true
    mode: live   # 2026-07-30 2d: run the realized sizer LIVE in PAPER (dry_run) to gather realized-sizing data — paper is the test bed
    lookback_sessions: 8
    min_n_down: 4     # 2026-07-30 2a: was 6 — downsize losing lanes sooner (protective; asymmetric, up stays 12)
    min_n_up: 12      # keep conservative — never grow a lane on <12 recent trades
    mult_floor: 0.40
    mult_ceil: 1.60
    roi_scale: 0.22   # 2026-07-30 2a: was 0.35 — smaller scale => tanh saturates faster => a given loss moves the mult more (was too timid: all mults stuck ~1.0)
    sensitivity: 0.80 # 2026-07-30 2a: was 0.6 — move the mult more per unit signal
    ema_alpha: 0.50   # 2026-07-30 2a: was 0.3 — faster convergence to target (still smoothed; also see state RESET so stale +prior inertia no longer sizes a 0%-WR lane UP)
    recompute_min_new_settles: 10
  # 2026-07-28 WARMUP GATE — settle into feed-sync before the FIRST trade after a
  # restart. Signal-based (NOT a timer): blocks NEW entries until the websocket is
  # delivering fresh prices across the universe (not REST-fallback) for
  # ready_cycles consecutive scans. max_warmup_sec is a hard backstop so it can
  # NEVER lock the bot out. Exits are never gated. Flip enabled:false to disable.
  warmup:
    enabled: true
    ready_cycles: 3          # consecutive synced scans required to release
    min_ws_coverage: 0.8     # 2026-07-30 REVERTED my 0.25 no-op (Codex debug sweep): _warmup_feed_ready (main.py:1550) does NOT read this field — warmup uses fresh-token-count + min_universe + max_sync_ms + price_max_age_sec. Lowering it does NOTHING, so I reverted to avoid a misleading "fix". REAL warmup TODO = wire an explicit coverage threshold into readiness OR reword this field. Left at 0.8 (inert either way).
    min_universe: 10         # need at least this many markets tracked first
    max_sync_ms: 8000        # scan phase must be healthy
    max_warmup_sec: 180      # hard backstop: trade anyway after 3 min
  overrun_recovery_sleep_sec: 5
  dry_run: false  # 2026-07-30 operator: LIVE. (--live --confirm-live also forces this False at runtime via main.py; set explicitly here so there is no ambiguity. A bare launch without --live still forces paper via _parse_run_args.)
  slippage_guard:
    enabled: true
    mode: enforce
    apply_in_paper: true  # 2026-07-30 PAPER CALIB Phase 2.4 (operator): run this fresh-book guard in PAPER too (was dry_run-bypassed) so paper fill-rate reflects live fillability. Enforces the read-robust signals (buy_spread_block / buy_edge_eroded) to rejected_candidates. Empty-book / sub-$1 notional is deferred to the paper fresh-fill layer (clob_client:1435) which already rejects+logs those — keeps paper frequency = fillability, not book-read quality (Codex).
    paper_mode: enforce   # in paper, mirror live `mode` (enforce = paper SKIPS unfillable entries, so paper frequency+PnL stop overstating). Set to observe to log-only without skipping.
    max_slippage_cents: 0.02
    max_spread_cents: 0.05  # 2026-07-30 P0 sweep: was 0.03 (GO-LIVE TRAP — paper bypasses this guard via dry_run, so the ~$80 paper run never felt it; live enforces it and 3c starves normal 3-4c crypto books). Jul-29 code + memory both ship 0.05; the pre-Jul-29 backup regressed it. Hot-reloadable.
    require_full_depth: false  # 2026-07-27: was true = demanded the ENTIRE order size at/below limit; on thin Polymarket books depth_at_limit (e.g. 10.0) fell just under requested (10.4167) and SKIPped nearly every live BUY. false = fill against AVAILABLE depth; the max_slippage_cents 0.02 + max_spread_cents 0.03 caps still protect the fill price.
    depth_price_ceiling_cents: 0.02  # 2026-07-27 (Codex P0): was 0.0 = zero-tolerance depth check (required full size at asks <= intended price EXACTLY), blocking ~every live BUY (eth 17x buy_depth_block/session). Match the max_slippage_cents 0.02 tolerance the guard already allows, restoring paper-parity WITHOUT loosening any strategy threshold.
  clob_ws:
    enabled: true
    ws_app_ping_sec: 10  # 2026-07-30 WS-STALENESS fix: keepalive PING every 10s so Polymarket keeps pushing book updates (idle sockets go stale, aging decision prices). Prices are Polymarket-sourced even on Olympus.
    book_channel: market
    subscribe_interval_sec: 30  # 2026-07-30 WS-CHURN tune (operator GO, RESTART-CLASS — Codex: clob_ws NOT in hot-reload whitelist, applies on next restart): 15->30 halves re-subscribe write pressure that triggered close_code=1006 "Cannot write to closing transport" flaps (~90/hr live).
    asset_ids_json_key: assets_ids
    drive_scanner_prices: true
    price_max_age_sec: 8
    subscribe_universe: true
    universe_subscribe_cap: 250  # 2026-07-30 WS-CHURN tune (operator GO, RESTART-CLASS — Codex: applies on next restart, main.py:2851): 400->250 sheds the deep-lookahead tail; subscribe loop is imminence-ordered (main.py:2853) so this KEEPS open-position + near 5m/15m tokens fresh, drops only the far 1h/deep that bloated the burst.
    rest_book_price_fallback: true  # 2026-07-30 WS-STALENESS tertiary fallback: recover tokens still unpriced after WS + /midpoint with a fresh top-of-book mid from GET /book (else they'd be fail-closed rejected = missed trades). Fail-safe.
  admit_real_05_books: false
  default_position_size: 6
  max_position_size: 25
  max_days_to_resolution: 365
  min_hours_to_resolution: 1
  max_exposure_per_trade: 0.08
  max_topic_exposure: 0.2
  daily_loss_limit: 0.15
  kelly_fraction: 0.37
  regime:
    enabled: false
    btc_break_above_usd: 80000
    btc_break_below_usd: 75000
  regime_feed:
    regime_log: data/calibration/market_regime.jsonl
    max_snapshot_age_sec: 1800
  entry_freshness_caps:  # 2026-07-30 restored from +$80 baseline (#2): xrp 5m/15m depend on fresh price; xrp dies at 20s+ staleness (own per-asset cap).
    xrp_macro: 20
  entry_tape_shadow:  # 2026-07-30 re-added (Codex): logs the fill-instant sub-30s spot micro-move per entry (join to EXIT mfe/pnl on trade_id) for live-vs-paper entry tuning. SHADOW ONLY — never affects entries/size/exits.
    enabled: true
    mode: shadow
    lookbacks_sec: [10, 20, 30]
  exit_rules:
    enabled: true
    take_profit_pct: 0.3
    stop_loss_pct: 0.3
    max_hold_hours: 72
    updown_stop_cents: 0.03
    updown_exit_window_mins: 2.25
    updown_max_hold_mins: 18.0
    updown_stop_loss_pct: 0.15
    updown_hold_winners_to_resolution: false
    stop_use_executable_price: true
    stop_dual_confirm_midpoint: true
    stop_spread_guard_max: 0.1
    realistic_paper_fills: true  # 2026-07-30 PAPER CALIB Phase 1.2 (operator): walk bids/asks like a live FAK exit so paper stop/TP PnL reflects real slippage, not the mark. Paper-only (live_testing engine). Restart-class.
    exit_require_two_sided_book: true
    exit_max_book_spread: 0.3
    exit_mark_use_clob_midpoint: true
    updown_stop_confirm_ticks: 2
    updown_min_hold_anchor_window_open: true
    updown_min_hold_sec_before_pct_exit:
      5m: 20
      15m: 60
      1h: 60
    bid_depth_exit:
      enabled: false
      mode: observe
      min_bid_depth_usd: 150
      depth_levels: 3
      only_when_losing: true
      min_mins_remaining: 5.0
    dynamic_stop_enabled: true
    dynamic_stop_bull_mult: 0.95
    dynamic_stop_range_mult: 1.05
    dynamic_stop_bear_mult: 1.15
    dynamic_stop_high_vol_mult: 1.15
    dynamic_stop_volatility_threshold: 0.02
    dynamic_stop_low_convergence_mult: 1.1
    dynamic_stop_high_convergence_mult: 0.95
    dynamic_stop_low_convergence_threshold: 0.55
    dynamic_stop_high_convergence_threshold: 0.75
    updown_exit_window_max_fraction: 0.5
    updown_high_entry_threshold: 0.6
    updown_stop_cents_high_entry: 0.02
    updown_in_profit_stop_trigger_pct: 0.0
    updown_in_profit_stop_tighten_to_pct: 0.0
    updown_trail_arm_pct: 0.1
    updown_trail_gap_pct: 0.15
    regime_conditioned_exits:
      enabled: false
      trend_side_hold_winners: false
      trend_side_trail_arm_pct: 0.1
      trend_side_trail_gap_pct: 0.15
      off_trend_force_tight: true
      exclude_lanes:
      - bitcoin
    updown_overrides:
      bitcoin:
        window_lane_overrides:
          15m:
            up:
              updown_stop_loss_pct: 0.25  # 2026-07-30 (operator GO): was 0.0 = NO early stop, so a loser rode to the -50% hold_catastrophic_stop. 0.25 < catastrophic 0.5 => normal stop fires first at -25% (matches the WINNING btc 1h up pattern: hold=true + real stop 0.3<0.5 -> updown_stop_loss not catastrophic). Keeps hold-to-resolution for winners, caps losers. (Lane has 0 fills good+live; safety cap.)
              updown_trail_arm_pct: 0.0
              updown_hold_winners_to_resolution: true
            down:
              # 2026-07-31 PAPER A/B (operator GO): flip hold=true. stop_hold_sweep proved the 33%
              # stop is the WORST point on the curve — winners AND losers both draw down -33..-40%
              # MAE, so NO stop width discriminates; every width 0.10-0.33 nets negative, only
              # HOLD/0.40+ flips positive (+22.34 sess, +18.05 since-0730). Direction right at
              # resolution 5/8. hold=true => hold_means_hold suppresses updown_stop_loss (code
              # live_testing.py:780) and rides to resolution, -50% catastrophic ONLY. The stop_loss
              # /take_profit below are now VESTIGIAL (suppressed on a hold lane) but kept as the
              # revert target. CAVEAT: +22.34 is tail-carried by one +44 trade (ex-outlier hold
              # = -15.82, still > stop -20.95). Accumulate n before any live consideration.
              updown_stop_loss_pct: 0.3
              updown_trail_arm_pct: 0.0
              updown_hold_winners_to_resolution: true
              take_profit_pct: 0.5
          1h:
            up:
              updown_stop_loss_pct: 0.3
              updown_hold_winners_to_resolution: true
              updown_trail_gap_pct: 0.1
              updown_trail_arm_pct: 0.0
              # 2026-07-30 (operator GO): TIME-GATED late TP. hold_winners stays TRUE (winners peak
              # +75-127% and RESOLVE; any ungated TP amputates them — failed 3x). A green >=+40% in
              # the FINAL 5 min is a FADE not a runner -> bank it. Validated best sim (n=37 round-trip
              # pool): TP0.40/gate5 = +$53.26 vs +$14.80 actual. Fires BEFORE the catastrophic stop.
              # Realized this session: 2x BTC 1h up round-tripped to catastrophic (-9.05, -8.84).
              take_profit_late_pct: 0.40
              take_profit_late_gate_mins: 5
            down:
              updown_trail_arm_pct: 0.25
              updown_trail_gap_pct: 0.1
          5m:
            up:
              updown_in_profit_stop_trigger_pct: 0.04
              updown_in_profit_stop_tighten_to_pct: 0.08
      bnb_macro:
        window_lane_overrides:
          5m:
            up:
              updown_exit_window_mins: 1.5
              updown_exit_window_max_fraction: 0.45
              updown_stop_cents: 0.015
              updown_high_entry_threshold: 0.56
              updown_stop_cents_high_entry: 0.01
              updown_stop_loss_pct: 0.15
              dynamic_stop_enabled: false
              updown_hold_winners_to_resolution: false
              updown_in_profit_stop_trigger_pct: 0.04
              updown_in_profit_stop_tighten_to_pct: 0.08
            down:
              updown_hold_winners_to_resolution: false
              updown_stop_loss_pct: 0.7
              dynamic_stop_enabled: false
          15m:
            up:
              updown_stop_loss_pct: 0.15
            down:
              updown_stop_loss_pct: 0.15
              updown_hold_winners_to_resolution: false
          1h:
            up:
              updown_trail_gap_pct: 0.1
              updown_trail_arm_pct: 0.25
              updown_stop_loss_pct: 0.15
              updown_hold_winners_to_resolution: false
              updown_in_profit_stop_trigger_pct: 0.04
              updown_in_profit_stop_tighten_to_pct: 0.08
            down:
              updown_trail_gap_pct: 0.1
              updown_trail_arm_pct: 0.25
              updown_stop_loss_pct: 0.15
      eth_macro:
        updown_stop_cents: 0.02
        updown_exit_window_mins: 3.0
        window_lane_overrides:
          1h:
            up:
              updown_trail_gap_pct: 0.15
              updown_trail_arm_pct: 0.1
              updown_stop_loss_pct: 0.15
              updown_hold_winners_to_resolution: true
            down:
              updown_trail_gap_pct: 0.1
              updown_trail_arm_pct: 0.25
              updown_stop_loss_pct: 0.15
          5m:
            down:
              # 2026-07-31 PAPER A/B (operator GO): flip hold=true. lane_stop_optimizer
              # (since-0730 n=8, dir-right 6/8) shows winners draw down DEEPER than losers
              # (winnerMAE 22% > loserMAE 18%) => any stop tight enough to cut losers also
              # guillotines winners. HOLD nets +21.71 payoff 1.06 vs every stopped width. Same
              # archetype as BTC 15m DOWN. stop_loss/cents below now VESTIGIAL (suppressed on a
              # hold lane, live_testing.py:780) — kept as revert target. -50% catastrophic only.
              updown_stop_loss_pct: 0.14
              updown_stop_cents: 0.015
              updown_exit_window_mins: 1.5
              updown_exit_window_max_fraction: 0.45
              updown_high_entry_threshold: 0.56
              updown_stop_cents_high_entry: 0.01
              updown_in_profit_stop_trigger_pct: 0.04
              updown_in_profit_stop_tighten_to_pct: 0.08
              updown_hold_winners_to_resolution: true
          15m:
            up:
              updown_exit_window_mins: 2.5
              updown_exit_window_max_fraction: 0.45
              updown_stop_cents: 0.02
              updown_high_entry_threshold: 0.58
              updown_stop_cents_high_entry: 0.015
              updown_stop_loss_pct: 0.15
              updown_hold_winners_to_resolution: false
            down:
              updown_stop_loss_pct: 0.15
              updown_stop_cents: 0.02
              updown_exit_window_mins: 2.5
              updown_exit_window_max_fraction: 0.45
              updown_high_entry_threshold: 0.58
              updown_stop_cents_high_entry: 0.015
              updown_in_profit_stop_trigger_pct: 0.05
              updown_in_profit_stop_tighten_to_pct: 0.1
              updown_hold_winners_to_resolution: false
      sol_macro:
        window_lane_overrides:
          5m:
            up:
              updown_hold_winners_to_resolution: false
              updown_in_profit_stop_trigger_pct: 0.04
              updown_in_profit_stop_tighten_to_pct: 0.08
            down:
