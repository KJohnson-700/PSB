    est_prob:
      atr_low_pct: 0.0076
      atr_high_pct: 0.0105
      # 2026-06-15: HYPE is momentum, not mean-reverting (ghost fit, n=64199, stable
      # all-time vs recent). P(up) RISES with RSI: >75 boost, <30 penalty, 65-75 neutral.
      # Reverses the default mean-revert UP-side RSI nudge. scripts/fit_hype_rsi_momentum.py
