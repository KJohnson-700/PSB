    # shares * fee_rate * price * (1 - price). This fallback is applied only
    # to 15m crypto up/down paper exits when live market metadata is missing.
    # 2026-06-13: reverted 0.036 -> 0.07. VERIFIED against the live Gamma API:
    # crypto up/down markets return feeSchedule={rate:0.07, exponent:1, takerOnly:true,
    # rebateRate:0.2}. So fee_rate IS 0.07. At price 0.50 that's $1.75 per 100 shares
    # (1.75% of max payout / ~3.5% of a 50c cost basis) — matches fill_sim + its tests
    # (polymarket_taker_fee_usdc(100,0.50,0.07)==1.75). The earlier 0.036 halved the
    # real rate (bad "fee_rate*0.5=1.8%" reasoning) and UNDER-charged paper exits ~2x.
