# ============================================
# AI CONFIGURATION
# ============================================
ai:
  # ── Master toggle ──────────────────────────────────────────────────────────
  # Requires non-empty provider_chain + at least one provider key (e.g. MINIMAX_API_KEY in .env).
  enabled: true
  # When false: live bot never calls LLM providers (quant-only paths). Backtests already use BacktestAIAgent, not real LLMs.
  live_inferencing: true

  # Soft daily request budget for local WARNING logs at 50% / 75%; 0 = disabled.
  free_tier_daily_request_budget: 1200

  # Ensemble consensus: when true, call all providers with keys and only return a signal
  # when at least consensus_min_agree agree on the same recommendation (BUY_YES/BUY_NO).
  consensus_enabled: false
  consensus_min_agree: 2

  # Provider chain — tries in order, falls back on failure.
  provider_chain:
    # MiniMax M2.7 (coding/token plan). Primary provider.
    - name: minimax
      type: minimax
      model: "MiniMax-M2.7"
      api_key_secret: MINIMAX_API_KEY
      json_mode: true
      # M2.7 can exceed the global ai.timeout on long generations.
      timeout_seconds: 120
      cooldown_on_429_seconds: 60

    # Optional: re-add OpenRouter (OPENROUTER_API_KEY) as a middle tier between MiniMax and Ollama
    # if you want cloud fallback without running a local model.

    # Local Ollama fallback (no API key required).
    - name: ollama_local
      type: openai
      base_url: "http://localhost:11434/v1"
      local: true
      models:
        - "qwen2.5:14b"
      json_mode: true
      cooldown_on_429_seconds: 0

  # Request timeout (seconds) — default for providers without timeout_seconds
  timeout: 90
  # Temperature for responses
  temperature: 0.1
  # Maximum tokens per response. MiniMax-M2.5 uses ThinkingBlocks before JSON,
  # so needs ~1500 total (thinking ~800 + JSON ~200). Was 4000, which was wasteful.
  max_tokens: 1500
  # Optional markdown+JSONL dump of validated marginal AI outputs (off by default).
  structured_log: false

  # ── Token conservation ──
  # Cache AI results per market for this many seconds (avoids re-analyzing same market every cycle)
  cache_ttl: 600  # 10 minutes
  cache_ttl_15m: 180  # 3 minutes — short-window candle markets stale quickly
  cache_ttl_5m: 60    # 1 minute — keep below ~20% of market lifetime
  # Minimum gap between consecutive API calls (seconds) — prevents burst rate limit hits
  min_call_gap: 2.0
  # Optional second-pass narrative call (Tier B). Log-only; does not change trade gates.
  research_narrative:
    enabled: false
    max_calls_per_scan: 2
    min_confidence_to_log: 0.60
    log_jsonl: true
    # Optional: force research calls through one provider/model while keeping
    # the normal marginal tiebreaker on the default provider_chain.
    provider_name: ""      # e.g. "minimax"
  # Enforced pre-entry AI approval layer. Starts on risky/marginal paths; do not
  # turn this into "AI generates every trade" until closed-trade calibration proves it.
  decision_layer:
    enabled: true
    min_confidence: 0.60
    hard_skip_if_unavailable_on_enforced: true
    use_shadow_portfolio: false  # direct AI is enforced now; shadow portfolio remains optional due latency/cost
    enforced_lanes:
      bitcoin:
        - neutral_15m
        - marginal
      sol_macro:
        - marginal
      eth_macro:
        - marginal
      hype_macro:
        - marginal
      xrp_macro:
        - marginal
  # Tier C: shadow 3-stage pipeline (Research → Trader → Portfolio). Log-only; no execution.
  shadow_pipeline:
    enabled: true
    max_calls_per_scan: 1
    min_confidence_to_log: 0.60
    log_jsonl: true
    provider_name: ""      # optional: pin to one provider name from provider_chain
    model_override: ""     # optional model id for all three stages
  # Pre-entry veto: when AI is consulted on a marginal trade and returns very low
  # confidence, kill the trade. Conservative — only fires on egregious uncertainty.
  preentry_veto:
    enabled: false
    min_confidence: 0.25
  # Post-trade journal annotation: after a successful entry is logged, fire-and-forget
  # AI call that writes a thesis/expectations/invalidation note as a separate
  # ANNOTATION journal line. Off the trade hot path. Includes correlation warning
  # when include_correlation_check is true.
  post_trade_annotation:
    enabled: true
    timeout_seconds: 20
    include_correlation_check: true
  # Off-cycle AI narrators (run via scripts/run_ai_session_summary.py).
  # Each section is gated independently. Output is appended to the strategy log.
  session_summary:
    enabled: true
    include_underperformance: true
    include_skip_exit_reasons: true
    include_calibration_drift: true
    include_strategy_conflict: true
    timeout_seconds: 30
    output_path: "projects/polymarket-bot/strategy-log/_ai_summary.md"
# ============================================
notifications:
  # Enable/disable notifications
  enabled: true
  # Discord webhook URL
  discord_webhook: ""
  # Telegram bot token
  telegram_bot_token: ""
  # Telegram chat ID
  telegram_chat_id: ""
  # Entry/fill Discord is disabled in code (notify_trade no-op); this flag is legacy / future use.
  alert_on_trade: false
  # Closed-position exit embeds (notify_exit) when webhook + enabled; defaults to alert_on_trade if omitted
  alert_on_exit: true
  # Startup / periodic status pings (off by default — reduces Discord noise)
  alert_on_status: false
  # Alert on errors
  alert_on_error: true

# ============================================
# RISK MANAGEMENT
# ============================================
risk:
  # Maximum concurrent positions
  max_concurrent_positions: 50
  # Maximum trades per day
  max_trades_per_day: 200
  # Position check interval (seconds)
  check_interval: 60
  # Emergency stop loss (%)
  emergency_stop_loss: 0.25

# ============================================
# TERM-BASED RISK
# ============================================
term_risk:
  # Budget Caps: How much of the TOTAL balance can be locked in each term
  caps:
    SHORT_TERM: 0.70  # < 7 days
    MID_TERM: 0.20    # 7-14 days
    LONG_TERM: 0.15   # > 14 days — raised from 0.10: sports fade 12/13 winning, budget was blocking good trades

  # Edge Requirements: Demand higher profit for longer lockups
  min_edge:
    SHORT_TERM: 0.05  # 5% edge is enough
    MID_TERM: 0.08    # 8% edge required
    LONG_TERM: 0.12   # 12% edge required (was 25%, too restrictive for testing)

  # Sizing: Percentage of total balance to risk per trade
  sizing:
    SHORT_TERM: 0.05
    MID_TERM: 0.02
    LONG_TERM: 0.02

# ============================================
# DYNAMIC EXPOSURE SCALING
# ============================================
exposure:
  # --- Tier sizing (max trade size per tier) ---
  # Operator target: FULL=$15, MODERATE=$10, MINIMAL=$5.
  # scale_size() also applies min_trade_usd after tier multiplier.
  full_size: 25.0        # FULL tier cap (raised 15→25 2026-05-07 to give edge room above $15 stake)
  moderate_size: 15.0    # MODERATE tier cap (raised 10→15)
  minimal_size: 8.0      # MINIMAL tier cap (raised 5→8)
  # After raw_size * tier_multiplier, apply this base floor, then cap by tier size.
  # With current multipliers (1.0 / 0.6 / 0.2) and caps above, the effective
  # results are FULL<=15, MODERATE<=10, MINIMAL<=5.
  min_trade_usd: 1.0
  # Hard post-multiplier floors. Prevent calibration/regime/exposure stacks from
  # turning an executable trade into dust size.
  full_min_trade_usd: 10.0
  moderate_min_trade_usd: 10.0
  minimal_min_trade_usd: 5.0

  # --- Kill switch ---
  loss_kill_switch_enabled: true  # 3 consecutive losses in a lane → pause that lane (paper: auto-resume after pause_cycles)
  max_consecutive_losses: 3   # 3 losses in a row = pause (only if kill switch enabled)
  pause_cycles: 2             # Test mode: pause for 2 trading cycles then check
  max_pause_cycles: 4         # Force-resume after this many paused cycles even if chop keeps trend_strength low
  # Live mode resume: "auto" (resume when conditions return) or "manual" (wait for restart)
  live_resume_mode: "auto"

  # --- Volatility thresholds (ATR as % of price) ---
  high_vol_pct: 0.015    # 1.5% = high volatility, full exposure
  low_vol_pct: 0.005     # 0.5% = flat, minimal exposure

  # --- Volume thresholds (current vs 20-bar avg ratio) ---
  high_volume_ratio: 1.3  # 30% above avg = high participation
  low_volume_ratio: 0.7   # 30% below avg = low participation

# ============================================
# BACKTEST
# ============================================
backtest:
  # Data source: "polymarketdata" (API) or "local" (CSV/Parquet)
  data_source: "polymarketdata"
  # Early exit: "hold_to_settlement" (default) or "time_and_target"
  exit_strategy: "time_and_target"
  max_hold_hours: 72
  take_profit_pct: 0.20
  stop_loss_pct: 0.15
  # Default resolution for historical data
  resolution: "1m"
  # Initial bankroll (500 for live test with $3-5 bets)
  initial_bankroll: 500

  # Polymarket YES 1m marks for crypto up/down exit replay (win-rate calibration vs live).
  # Requires POLYMARKETDATA_API_KEY. Slugs match the scanner unix family:
  #   {btc|sol|eth|xrp|hype}-updown-{5m|15m|30m}-{UTC_window_start_epoch}
  # Caches per window under cache_dir. When disabled or fetch sparse, engine uses
  # the underlying OHLCV YES proxy (legacy).
  polymarket_marks:
    enabled: false
    cache_dir: "data/backtest/polymarket_marks"

  # Execution realism (for accurate backtests)
  slippage:
    # Basis points of slippage when spread not available (25 bps = 0.25%)
    default_bps: 25
    # Use half-spread as slippage when metrics provide spread (more accurate)
    use_spread_when_available: true
  # Per-trade fee in bps (0 = most Polymarket markets are fee-free)
  fee_bps: 0

  # Min edge thresholds — keep in sync with strategies.* min_edge values
  # Engine reads these from backtest.min_edge_* (not from strategies directly)
  min_edge_btc_15m:  0.10   # matches strategies.bitcoin.min_edge
  min_edge_btc_5m:   0.08   # matches strategies.bitcoin.min_edge_5m (raised 2026-04-24)
  min_edge_sol_15m:  0.09   # matches strategies.sol_macro.min_edge
  min_edge_sol_5m:   0.085  # matches strategies.sol_macro.min_edge_5m (raised 2026-05-06)
  min_edge_eth_15m:  0.09   # matches strategies.eth_macro.min_edge
  min_edge_eth_5m:   0.10   # matches strategies.eth_macro.min_edge_5m (raised 2026-05-08)
  min_edge_xrp_15m:  0.09   # matches strategies.xrp_macro.min_edge (raised 2026-04-24)
  min_edge_xrp_5m:   0.085  # matches strategies.xrp_macro.min_edge_5m (raised 2026-05-08)
  min_edge_hype_15m: 0.09   # matches strategies.hype_macro.min_edge
  min_edge_hype_5m:  0.07   # matches strategies.hype_macro.min_edge_5m (was 0.09; live floor is 0.07)

# ============================================
# LEARNING LOOP (journal → stats → proposals; never auto-edits YAML)
# ============================================
learning_loop:
  enabled: false
  # Minimum closed trades before RSI segment / edge-calibration rules fire
  min_trades_for_rules: 15
  min_trades_per_segment: 15
  include_archive: true
  persist_artifacts: true
  proposal_dir: data/learning/proposals
  write_vault_log: true
  # AI path (journal extra.ai_used): propose ai_confidence_threshold after enough LLM-touched trades look weak
  ai_proposal_min_trades: 75
  # Optional: only evaluate when AI-touched count <= this (off = no upper limit)
  ai_proposal_max_trades: null
  ai_proposal_win_rate_below: 0.63
  ai_proposal_require_negative_pnl: true
  # Stricter margin: also require negative avg return / notional on AI trades (needs enough fills)
  ai_proposal_require_negative_avg_return_on_notional: false
  ai_proposal_margin_min_realized_n: 15
  ai_confidence_bump: 0.02
  # Kelly reduction skips when AI-touched cohort is this large (use AI proposal instead)
  kelly_rule_max_ai_trades: 50
  # Optional: strategy -> { win_rate, avg_edge, trades_per_day } for drift checks (see live_testing.DriftReport)
  backtest_expectations: {}
  # Override default vault append path (repo-relative or absolute)
  # vault_path: projects/polymarket-bot/strategy-log/learning-loop.md

# ============================================
# PERFORMANCE FEEDBACK (runtime drift → bounded in-memory tightening)
# ============================================
# Compares live journal EXIT stats to backtest expectations (reports + optional YAML).
# Never auto-edits settings.yaml; multipliers live in config["_runtime_feedback"] only.
performance_feedback:
  enabled: false
  # Run drift check every N unified trading cycles (see trading.cycle_interval_sec).
  refresh_every_n_cycles: 6
  # Minimum live EXIT sample per strategy before labeling divergence (aligns with DriftReport gate).
  min_live_sample: 15
  # When DriftReport.is_diverging: multiply effective min_edge by this factor, then clamp.
  min_min_edge_mult: 1.0
  max_min_edge_mult: 1.15
  diverge_min_edge_mult: 1.08
  # Optional Kelly tightening when diverging (1.0 = off). Clamped to kelly_mult_min/max.
  kelly_mult_when_diverging: 1.0
  kelly_mult_min: 0.5
  kelly_mult_max: 1.0
  # Merge learning_loop.backtest_expectations into report-derived expectations (YAML fills gaps/overrides).
  merge_learning_loop_expectations: true

# ============================================
# LOGGING
# ============================================
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  # Log file max size (MB)
  max_file_size: 10
  # Number of backup files
  backup_count: 5
  # Log to console
  console: true
  # Log to file
  file: true
  # One-line OPS_JSON pulses to stdout + startup snapshot; disable for quieter local runs
  ops_pulse: true
  # Also persist OPS_JSON lines to data/logs/ops_pulse.jsonl for Hermes/offline review.
  ops_pulse_file: true

# ============================================
# DASHBOARD
# ============================================
dashboard:
  # Enable/disable the web dashboard
  enabled: true
  # Host for the dashboard server
  host: "127.0.0.1"
  # Port for the dashboard server
  dashboard_port: 8081
  # Kick off the standard SOL 5m crypto backtest whenever the dashboard/bot restarts into a fresh paper session.
  auto_sol5_backtest_on_startup: false
  # Kick off the standard SOL 5m crypto backtest whenever a new paper session is created from the dashboard.
  auto_sol5_backtest_on_reset: false
  # Weather backtests are manual by default; they should not consume startup/cycle
  # resources for the crypto trading bot.
  auto_weather_backtest_on_startup: false
  auto_weather_backtest_on_reset: false
