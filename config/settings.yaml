# Polymarket Trading Bot Configuration
# Version: 1.0.0

# ============================================
# POLYMARKET CONNECTION
# ============================================
polymarket:
  # API Endpoint (CLOB)
  api_endpoint: "https://clob.polymarket.com"
  # GraphQL endpoint for market data
  graphql_endpoint: "https://graphql.polymarket.com/matic"
  # WebSocket endpoint
  ws_endpoint: "wss://ws-subscriptions-clob.polymarket.com/ws"
  # Default network
  network: "polygon"
  chain_id: 137
  # Minimum liquidity to consider a market (USD)
  min_liquidity: 10000
  # Maximum spread to trade (decimal)
  max_spread: 0.05
  # Bundled Gamma + updown HTTP runs in a worker thread; max seconds before empty scan.
  scanner_sync_timeout_sec: 35
  # Bounded fallback for named HYPE/Hyperliquid event slugs not covered by the
  # normal up/down fetch. This no longer crawls the full active event set.
  fetch_hype_alt_markets: true
  # Extra 30m discovery: Gamma often has no {asset}-updown-30m-{unix} markets; also try compact
  # ET range slugs (bitcoin-up-or-down-may-13-430am-500am-et) matching the HYPE alt slug family.
  fetch_updown_30m_human_compact_slugs: true
  # If true, markets from the *-updown-15m-* slug responses with ~30m window_minutes (title)
  # are merged into the updown_30m list (Gamma often has no *-updown-30m-* listings).
  updown_30m_merge_from_15m_slug_batch: true
  fetch_weather_markets: false
  # Gamma REST: retries for transient timeouts / 5xx (slug and list fetches).
  gamma_http_max_retries: 3
  gamma_http_retry_backoff_base_sec: 0.5

# Hyperliquid candle HTTP (live HYPE + OHLCV backfill). Retries tame transient timeouts.
hyperliquid:
  # Read timeout: applies to body-receive only (split from connect). Bumped 2026-05-06
  # after observing 18.5s tail-latency outliers timing out at the prior 18s ceiling.
  request_timeout_sec: 25
  range_request_timeout_sec: 30
  # Connect timeout: TCP+TLS handshake budget. Short — if Cloudflare edge is dead,
  # fail fast and retry rather than burn the read budget on connect.
  connect_timeout_sec: 5
  max_retries: 4
  retry_backoff_base_sec: 0.5
  # Stale-on-error fallback: if all retries fail, serve last good cached candles
  # up to this age (sec). Prevents a brief Hyperliquid blip from blacking out
  # HYPE signal generation for an entire scan cycle.
  stale_on_error_max_age_sec: 180

# ============================================
# TRADING PARAMETERS
# ============================================
trading:
  # Single trading loop: scan, exits, crypto strategies, resolution (seconds). Was 300s main + 120s crypto; now one cadence.
  cycle_interval_sec: 60
  # Dry run mode (no real trades)
  dry_run: true
  # CLOB WebSocket: L2 books for **open-position** YES/NO tokens. Dashboard `/api/orderbook` prefers this cache; falls back to public REST.
  clob_ws:
    enabled: true
    book_channel: market
    subscribe_interval_sec: 15
    asset_ids_json_key: assets_ids
  # Position sizing (USD per trade). Polymarket: BUY=$, SELL=shares; strategies always compute $.
  # Target band ~$10–$15: Kelly is clamped here; exposure tier caps narrow the band.
  # Still capped by max_exposure_per_trade (% of bankroll) inside PositionSizer.
  default_position_size: 10   # min $ per trade (floor for Kelly/sizing)
  max_position_size: 15      # hard ceiling per trade (operator target: ~$10–$15)
  # Resolution window: only trade markets resolving within this window. Cuts noise from end-of-year markets.
  max_days_to_resolution: 365  # Effectively disabled — each strategy enforces its own resolution window
  min_hours_to_resolution: 1   # Allow crypto/updown markets (resolve in minutes)
  # Maximum portfolio exposure per trade (%)
  max_exposure_per_trade: 0.05
  # Maximum portfolio exposure per topic (%)
  max_topic_exposure: 0.20
  # Daily loss limit before stopping (%)
  daily_loss_limit: 0.15
  # Kelly criterion fraction (0.0 - 1.0)
  kelly_fraction: 0.37    # 2026-05-07: 1.5× original 0.25; global default fallback aligned with calibrated per-strategy values
  # Optional BTC spot regime hints for ops (/api/ops/summary, OPS_JSON). Does not gate trades alone.
  regime:
    enabled: false
    btc_break_above_usd: 80000
    btc_break_below_usd: 75000
  # Position exit rules (live trading)
  exit_rules:
    enabled: true                # Enabled: live data shows positions move 40-50% against without stops
    take_profit_pct: 0.50        # 2026-05-10: raised 0.15 → 0.50. Updown audit (test_20260509_212625): TP fired at avg +35% but resolved-YES trades returned +124%. Bot exits at ~quarter of available upside; raising captures more of the binary settlement curve. Used for BOTH non-updown and updown markets (code path: live_testing.py `if pnl_pct >= self.take_profit_pct`).
    stop_loss_pct: 0.30          # Tightened from 0.40: Weinstein -$2.40 nearly wiped all gains; losses 1.7x wins
    max_hold_hours: 72           # Exit after 72 hours regardless (non-updown markets)
    # Updown market exits (SOL/ETH/XRP/BTC/HYPE 5m / 15m / 30m candle markets)
    # Journal mapping (see docs/session_reports/may11_2026_exit_reason_reconciliation.md):
    #   - `updown_stop_loss`  → `updown_stop_loss_pct` (same-position % adverse vs cost basis; anytime in hold).
    #   - `updown_time_stop`  → `updown_stop_cents` + `updown_exit_window_mins` (+ max_fraction / high-entry override).
    # SOL paper (May 2026): time-stop $ losses (-$3 avg) dominated thin TP wins (+$2.25); outsized
    # stops when price was already adverse before the final minute. Tighter ¢ threshold + slightly
    # earlier window → exit on smaller late drift instead of letting loss widen into the last 90s.
    updown_stop_cents: 0.03      # Late-window cents leg; journals as `updown_time_stop` when adverse within window
    updown_exit_window_mins: 2.25 # Minutes remaining ≤ effective window (after max_fraction cap) for cents stop
    updown_max_hold_mins: 18.0  # Safety valve for missing end_date; trim from 20m
    updown_stop_loss_pct: 0.20   # Journals as `updown_stop_loss` — NOT the 3¢ late-window rule (see live_testing.py)
    updown_exit_window_max_fraction: 0.5  # Cap cents-stop window at this fraction of runway-at-entry; set 1.0 to disable
    # #5: entry-price-conditional cents stop. Entries ≥ threshold use the tighter stop (less room before YES → 0).
    updown_high_entry_threshold: 0.60
    updown_stop_cents_high_entry: 0.02
    # #3: in-profit % stop tightening. Default disabled (both 0). Example to enable: trigger 0.05, tighten_to 0.12 → once unrealized pnl ≥ +5%, the adverse % stop tightens from 20% to 12%.
    updown_in_profit_stop_trigger_pct: 0.0
    updown_in_profit_stop_tighten_to_pct: 0.0
    # Optional per-strategy overrides for updown exits.
    # Used to tune individual lanes without changing global BTC/SOL/ETH/HYPE/XRP behavior.
    updown_overrides:
      eth_macro:
        updown_stop_cents: 0.02
        updown_exit_window_mins: 3.0
      xrp_macro:
        updown_stop_cents: 0.03      # reverted from 0.04 (candidate B, 2026-05-06) — time_stop bleed -$28.47/9 trades
        updown_exit_window_mins: 2.25 # reverted from 1.5 (candidate B, 2026-05-06) — back to global parity

data_collection:
  weather:
    enabled: false
    interval_sec: 300
    path: "data/market_prices/weather_prices.jsonl"

# ============================================
# STRATEGY THRESHOLDS
# ============================================
# Entry spec: docs/STRATEGY_ENTRY_SPEC.md
# - No hard floor on entry price; enter when edge > min threshold.
# - Max position size: Kelly + risk limits. Do not chase random small dips;
#   remain open to strong mispricings at any price (e.g. 27-30¢) when edge suffices.
strategies:
  # Live trading scope: bitcoin, sol_macro, eth_macro, xrp_macro, hype_macro, weather.

  # Consensus / "opportunity" Discord alerts removed from the bot — Discord is fills + exits
  # for crypto strategies only. This block is unused at runtime; kept for tests / reference.
  consensus:
    enabled: false
    # Threshold for consensus alert (decimal)
    threshold: 0.85
    # Minimum liquidity on opposite side (USD)
    min_opposite_liquidity: 500
    # Hours until expiration to monitor
    expiration_window_hours: 48

  # Weather (NOAA/Open-Meteo vs market; gap >15¢ = enter) — backup/alternative
  weather:
    enabled: false
    gap_min: 0.15
    borderline_high: 0.10
    min_ev: 0.05
    min_liquidity: 1000
    min_volume: 2000
    scan_limit: 120
    # Keep weather off the general market feed unless explicitly testing weather.
    # Dedicated weather fetch is also disabled by default under polymarket.
    scan_from_general_markets: false
    resolution_window_enabled: false   # Operator toggle: false = keep min-hours guard but disable the 72h cap
    min_hours_to_resolution: 2.0
    max_hours_to_resolution: 72.0      # Used only when resolution_window_enabled=true
    max_yes_price: 0.45
    kelly_fraction: 0.37    # 2026-05-07: 1.5× original 0.25; weather (currently disabled but tracked)
    max_position_size: 20
    metar_enabled: true
    forecast_horizon_days: 3
    use_weather_ai: false
    max_weather_ai_calls_per_scan: 3
    ensemble_disagreement_threshold: 0.12
    ensemble_min_confidence: 0.55
    weather_ai_timeout_sec: 25
    weather_ai_cache_ttl_sec: 600
    # Bias correction uses city+horizon buckets; need this many resolved obs before apply_correction adjusts forecasts.
    calibration_min_observations: 30
    # Cap implied edge used for Kelly when calibration_count is below min (avoids huge size on bad model/market mismatch).
    uncalibrated_kelly_edge_cap: 0.12
    # Skip monthly / extended precipitation markets until a bucket has enough calibration history (Seattle April-style).
    skip_extended_precip_without_calibration: true

  # Bitcoin Up/Down strategy — trades BTC price prediction markets
  bitcoin:
    enabled: true
    dead_zone_enabled: false   # off: no UTC hour blocking for BTC up/down (parity with macro strategies)
    # LLM tiebreaker for marginal edge and no-threshold markets; false = skip those branches.
    use_ai: true
    min_liquidity: 1000           # Lowered: 15m updown markets have ~$1.5k-$37k liquidity
    min_edge: 0.10                # 15m: raised from 0.07 — backtest assumed 0.50 entry (unrealistic); real slippage needs more edge
    min_edge_5m: 0.08             # 5m: raised from 0.05 (2026-04-24) — NEUTRAL HTF 5m path has zero backtest coverage; 0.05 too loose
    min_edge_15m_neutral: 0.12    # 2026-05-09 audit: BTC 15m NEUTRAL quant-only was low-conf negative; force AI/veto or skip
    neutral_15m_min_quant_confidence: 0.58  # jmazzini-style composite guard: low-conf neutral 15m must get AI confirmation
    neutral_15m_requires_shadow_portfolio: true
    neutral_15m_min_composite_score: 0.68
    neutral_rsi_min: 45.0         # 2026-05-08 live audit: RSI 45-55 was 25% WR / -$14.12
    neutral_rsi_max: 55.0
    neutral_rsi_extra_min_edge: 0.02
    # Ops compromise between legacy 50 (strict NEUTRAL churn vs macros at 20) and full parity at 20.
    min_4h_hist_magnitude: 35
    max_edge_updown: 0.12         # Safety cap: live audit showed >0.12 underperformed; investigate before raising
    ai_confidence_threshold: 0.60
    # Cap LLM calls per scan cycle (marginal / no-threshold / updown assist).
    max_ai_calls_per_scan: 12
    # Second-stage LLM on updown when edge is below min but in marginal band (see STRATEGY_ENTRY_SPEC).
    use_ai_updown: true
    ai_updown_marginal_min_edge: 0.03
    # AI-hold soft veto: if AI said HOLD on a market, the 5m quant path must
    # clear this higher edge threshold within the TTL window to override it.
    ai_hold_veto_ttl_sec: 300       # 5 minutes — one full 5m candle window
    min_edge_5m_ai_override: 0.10   # 2x normal min_edge_5m — strong conviction needed to override AI HOLD
    # Preferred minutes-left band for marginal up/down tie-break timing (not an AI gate).
    # Values are minutes remaining until resolution.
    entry_timing_window_15m_min: 2.0   # align with quant band; 60s cycle + latency
    entry_timing_window_15m_max: 15.0
    entry_timing_window_5m_min: 0.5
    entry_timing_window_5m_max: 5.0
    kelly_fraction: 0.30    # 2026-05-07: calibrated so edge×kf×br lands in tier band — preserves edge differentiation
    entry_price_min: 0.10           # For directional threshold markets (wide range intentional)
    entry_price_max: 0.90
    # Tight band for updown markets — prevents betting against strong market consensus.
    # yes_price outside this range means the market has already priced in the move.
    entry_price_min_updown: 0.45
    entry_price_max_updown: 0.55
    # Up/down entry timing window (minutes until resolution); edge/price gates still apply.
    # Note: listings often appear with mins_left > 15 before the quoted candle — entry_window_15m_max must reflect that.
    entry_window_15m_min: 2.0
    entry_window_15m_max: 16.0
    entry_window_5m_min: 0.5      # tight 5m windows; fire earlier in candle
    entry_window_5m_max: 5.0
    # Auto-align entry windows to scan cadence to avoid repeated "outside_entry_window" misses.
    entry_window_auto_align: true
    entry_window_align_scan_interval_sec: 60
    entry_window_auto_align_max_expand_min: 3.0
    entry_window_auto_align_jitter_sec: 10
    # Shave seconds off mins_left before band check (sync + strategy evaluation latency).
    entry_window_latency_buffer_sec: 12
    # Price zones where AI is skipped (edge is obvious)
    clear_edge_low: 0.20
    clear_edge_high: 0.80
    # 5m scanner look-ahead: how many future 5m windows to fetch
    look_ahead_15m: 8
    look_ahead_5m: 1
    # UTC hours to block for updown markets
    # 2026-04-21 scope-back (Tier A only): keep hours with strong backtest evidence
    # at meaningful negative expectancy, drop the borderline ones until live data
    # (≥15 trades/hour post-fix) confirms or denies them. See strategy-log/bitcoin.md.
    # Backtest (BTC 15m, Mar 2026, 540 trades ≈ 22 trades/hour):
    #   Tier A (KEEP, block): H01=26.9%WR -$61.68; H02=27.3%WR -$50.28 — extreme
    #     WRs unlikely to flip even with wider CIs; H00 also has live-data evidence.
    #   Tier B (WATCH, unblocked until live-confirmed):
    #     H03=40.9%WR -$20.35; H09=44%WR -$14.81; H15=42.1%WR -$15.70; H18=41.7%WR -$24.56
    #     — at n≈22 per hour the 95% CI on 41–44% WR overlaps 50%; "bad-leaning"
    #     rather than confidently bad. Re-audit weekly via scripts/hourly_heatmap.py --suggest.
    #   H22 had live-data evidence but no n cited — also moved to watch.
    # Best hours (reference): H10=76%WR +$66, H21=76%WR +$55, H12=68%WR +$40
    # WARNING: these hours were identified from the same live sessions they now gate.
    # Calibrating on the data you're filtering is in-sample overfitting — hours that
    # look bad may be statistical noise at n≈22/hour. Only graduate to Tier A after
    # ≥15 trades/hour with WR<0.46 AND avg_pnl<-$2 on OUT-OF-SAMPLE data.
    # Run scripts/hourly_heatmap.py --suggest to re-audit; never tune from backtest alone.
    blocked_utc_hours_updown: [0, 1, 2, 7, 11]
    # false = allow BUY_YES when HTF is bullish (true suppressed LONG/up signals in practice).
    disable_buy_yes: false
    # 2026-05-04: BTC grinding UP — counter-trend BUY_NO was 36% WR (-$14.60). Disable until
    # BTC regime shifts. Re-enable when 4H MACD crosses bearish and price rolls over.
    disable_buy_no_counter_trend: true
    # Require stronger edge for BUY_NO entries (short in a bull/mixed market needs conviction).
    min_edge_buy_no: 0.11
    macro_event_guard_enabled: true
    macro_event_guard_before_min: 30
    macro_event_guard_after_min: 30
    # Scheduled high-impact macro events in UTC. Strategy skips entries inside each event window.
    # Source schedules: BLS CPI, BLS Employment Situation (NFP), Fed FOMC calendars.
    # Format: [{name, datetime_utc, before_min?, after_min?}] where datetime_utc is ISO8601 UTC.
    macro_event_calendar_utc:
      - name: "NFP (Employment Situation)"
        datetime_utc: "2026-05-08T12:30:00Z"
      - name: "CPI"
        datetime_utc: "2026-05-12T12:30:00Z"
      - name: "NFP (Employment Situation)"
        datetime_utc: "2026-06-05T12:30:00Z"
      - name: "CPI"
        datetime_utc: "2026-06-10T12:30:00Z"
      - name: "FOMC Rate Decision"
        datetime_utc: "2026-06-17T18:00:00Z"
      - name: "NFP (Employment Situation)"
        datetime_utc: "2026-07-02T12:30:00Z"
      - name: "CPI"
        datetime_utc: "2026-07-14T12:30:00Z"
      - name: "FOMC Rate Decision"
        datetime_utc: "2026-07-29T18:00:00Z"
      - name: "NFP (Employment Situation)"
        datetime_utc: "2026-08-07T12:30:00Z"
      - name: "CPI"
        datetime_utc: "2026-08-12T12:30:00Z"
      - name: "NFP (Employment Situation)"
        datetime_utc: "2026-09-04T12:30:00Z"
      - name: "CPI"
        datetime_utc: "2026-09-11T12:30:00Z"
      - name: "FOMC Rate Decision"
        datetime_utc: "2026-09-16T18:00:00Z"
      - name: "NFP (Employment Situation)"
        datetime_utc: "2026-10-02T12:30:00Z"
      - name: "CPI"
        datetime_utc: "2026-10-14T12:30:00Z"
      - name: "FOMC Rate Decision"
        datetime_utc: "2026-10-28T18:00:00Z"
      - name: "NFP (Employment Situation)"
        datetime_utc: "2026-11-06T13:30:00Z"
      - name: "CPI"
        datetime_utc: "2026-11-10T13:30:00Z"
      - name: "NFP (Employment Situation)"
        datetime_utc: "2026-12-04T13:30:00Z"
      - name: "CPI"
        datetime_utc: "2026-12-10T13:30:00Z"
      - name: "FOMC Rate Decision"
        datetime_utc: "2026-12-09T19:00:00Z"
    # NEUTRAL + ambiguous 4H MACD for BTC up/down: bitcoin.py uses 15m impulse then Sabre (no hard sit-out).

  # SOL Macro strategy — BTC-to-Solana correlation lag trading
  sol_macro:
    enabled: true               # Retuned and re-enabled
    dead_zone_enabled: false   # A/B: disabled in config; code default remains true if key is missing
    # LLM tiebreaker for marginal edge; false = skip marginal AI branch.
    use_ai: true                 # Re-enabled: lag signal stripped from updown markets, AI re-enabled
    min_liquidity: 1000           # Lowered: 15m updown markets have ~$1.5k-$22k liquidity
    min_edge: 0.09                # 15m: align with XRP/ETH; pair with min_edge_15m_when_ltf_unconfirmed (was implicit 0.10 stack)
    min_edge_5m: 0.085            # raised from 0.07 (2026-05-06) — 5m bleed mitigation; tighten marginal admissions
    hard_min_edge: 0.07           # keep aligned with 5m floor; avoid blocking valid 5m edges
    min_edge_15m_when_ltf_unconfirmed: 0.10   # softened from 0.11: reduce 15m starvation when no LTF but other gates align
    require_btc_catalyst_15m_when_unconfirmed: true  # no LTF + no catalyst = skip; stops pure macro-guess 15m entries
    anti_ltf_gate_enabled: false
    require_ltf_confirmation: false
    center_price_band: 0.02
    min_edge_when_centered: 0.12
    center_price_requires_catalyst: true
    max_edge_updown: 0.15         # Fixed: was 0.09 while min_edge_unconfirmed=0.10 — impossible band (min > max)
    buy_no_ltf_override_enabled: true         # paper calibration: open BUY_NO lane on confirmed bearish short-window tape
    buy_no_ltf_override_rsi_max: 45.0
    buy_no_ltf_override_max_btc_5m_pct: 0.0
    ai_confidence_threshold: 0.60
    max_ai_calls_per_scan: 12
    use_ai_updown: true          # Re-enabled: lag signal stripped, AI now safe to use on updown
    ai_updown_marginal_min_edge: 0.03
    require_oracle_for_updown: true
    oracle_max_age_sec: 180
    oracle_max_basis_bps: 10.0
    ai_hold_veto_ttl_sec: 300
    min_edge_5m_ai_override: 0.10
    entry_timing_window_15m_min: 2.0   # align with quant band; 60s cycle + latency
    entry_timing_window_15m_max: 15.0
    entry_timing_window_5m_min: 0.5
    entry_timing_window_5m_max: 5.0
    kelly_fraction: 0.27    # 2026-05-07: calibrated so edge×kf×br stays inside tier band; SOL
    entry_price_min: 0.42         # widened 2026-05: sideways tape often sits 0.50–0.57 vs old 0.46–0.54 band
    entry_price_max: 0.58
    # Require lag magnitude >= this % before entering on a real-lag signal (avoids weak false lags)
    min_lag_magnitude_pct: 0.40   # Keep until larger live sample confirms raising it helps
                                  # Higher threshold filters weak/stale lag signals
    # sol_btc_service: BTC spike floors (were hardcoded 0.3% / 0.8%) + min SOL catch-up gap for lag_opportunity
    btc_spike_floor_pct_5m: 0.15
    btc_spike_floor_pct_15m: 0.40
    lag_signal_min_pct: 0.12
    # Macro NEUTRAL + no BTC spike and no lag: allow alt 1H fallback when false (sideways / starvation fix)
    neutral_macro_require_spike_or_lag: true
    # True = do not LONG into alt 1H bearish / SHORT into alt 1H bullish (reduces fading SOL headwind).
    enforce_alt_1h_alignment: true
    rsi_buy_block_above: 70.0
    rsi_sell_block_below: 30.0
    rsi_hard_gate_enabled: false          # default to soft gating in trend regimes
    rsi_soft_penalty_enabled: true
    rsi_soft_penalty_buy_yes: 0.04        # reduce LONG conviction instead of binary veto
    rsi_soft_penalty_buy_no: 0.00         # keep BUY_NO RSI as diagnostic only; do not suppress entries
    # 5m markets: require an active BTC spike or lag before entering (avoids guessing in flat markets)
    require_btc_catalyst_5m: true    # 2026-05-07: full intervention — SOL live trades were all 5m BUY_YES and backtest 5m remains deeply negative; require real catalyst on 5m
    low_corr_suppresses_entries: true   # tuning guard: hard-veto low-corr SOL entries while 5m/15m lane is under review
    skip_on_degraded_correlation: true
    degraded_correlation_size_multiplier: 0.50
    late_window_block_mins: 1.0         # do not enter with <=1 minute left
    late_window_tighten_mins: 3.0       # 1-3 minutes left needs stronger edge
    late_window_extra_min_edge: 0.14
    tuning_size_multiplier: 1.0         # 2026-05-07: removed temporary 0.60 downsize; expectancy repair handled by gate changes this session
    degraded_bearish_est_up: 0.45
    require_btc_volatility_gate: false
    min_btc_move_pct_5m_for_lag_entries: 0.15
    min_btc_move_pct_15m_for_lag_entries: 0.25
    # IQL: MACD histogram is in raw price units; 0.03 was far too tight for SOL (~$84).
    # 0.15 ≈ same order as typical SOL 15m hist on meaningful moves; keeps filter on vs disabling IQL entirely.
    iql_15m_enabled: true
    iql_15m_hist_floor: 0.10      # lowered from 0.15 (2026-05-06) — 0.15 too strict for SOL ~$80 MACD scale; 15m starvation
    # UTC hours to block for updown markets
    # 2026-04-21 scope-back (Tier A only): keep only hours with strong backtest
    # evidence (n ≥ ~500) at materially negative expectancy; remove live-sample
    # additions whose n falls below or near scripts/hourly_heatmap.py MIN_TRADES=5.
    # Backtest (SOL 15m, 621 trades ≈ 26 trades/hour):
    #   Tier A (KEEP, block): H01=38.1%WR -$33.28; H06=42.3%WR -$28.61; H23=40.7%WR -$30.47
    #   Tier B (WATCH, unblocked):
    #     H09 — added 2026-04-18 from paper reset_20260416 slice n=7 ~29% WR -$25
    #       (reasoning was "parity with BTC/ETH" more than standalone evidence;
    #       below MIN_TRADES=5 bar's margin of safety).
    #     H18=14%WR -$16.78 and H22=14%WR -$16.82 — implied n≈7 from the WR,
    #       no explicit sample size cited; too small to confirm.
    #     H10=-$13.55, H20=-$11.86 — negative in backtest but never blocked; watch.
    # Do NOT block backtest-best H17 — config author flagged it conflicts with tiny
    # live samples. Same principle now applied to H9/H18/H22. Re-audit weekly with
    # scripts/hourly_heatmap.py --suggest once live trades accumulate (≥15/hour).
    blocked_utc_hours_updown: [1, 6, 23]  # Tier A only — re-expand from live heatmap, not backtest alone
